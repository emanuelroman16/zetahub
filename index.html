<meta charset="UTF-8">
<title>Zeta Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090b;
    --surface:#131519;
    --surface-2:#1a1d22;
    --surface-3:#22262d;
    --ink:#f5f6f8;
    --ink-soft:#a6acb6;
    --ink-faint:#6c7280;
    --border:#24272e;
    --border-soft:#1a1d22;
    --navy:#1b1f26;
    --navy-strong:#0a0b0d;
    --on-navy:#f5f6f8;
    --chrome:#8ab4ff;
    --accent:#4c8dff;
    --accent-strong:#8ab4ff;
    --accent-soft:rgba(76,141,255,.14);
    --pill:#ffffff;
    --pill-ink:#0b0c0f;
    --success:#3ddc9a;
    --success-soft:rgba(61,220,154,.14);
    --warning:#fbbf24;
    --warning-soft:rgba(251,191,36,.14);
    --danger:#f87171;
    --danger-soft:rgba(248,113,113,.14);
    --cat-general:#5b9bf5; --cat-general-soft:rgba(91,155,245,.16);
    --cat-capitular:#b09cf9; --cat-capitular-soft:rgba(176,156,249,.16);
    --cat-directiva:#9aa1ad; --cat-directiva-soft:rgba(154,161,173,.16);
    --cat-cen:#f472b6; --cat-cen-soft:rgba(244,114,182,.16);
    --cat-social:#fb923c; --cat-social-soft:rgba(251,146,60,.16);
    --cat-civica:#2dd4bf; --cat-civica-soft:rgba(45,212,191,.16);
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:10px;
    --font-display:'Archivo', 'Segoe UI', sans-serif;
    --font-body:'Public Sans', -apple-system, 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, monospace;
    --shadow-card:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -16px rgba(0,0,0,.7);
    --shadow-pop:0 30px 70px -24px rgba(0,0,0,.9);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  .frame{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  @media (min-width:900px){
    .frame{max-width:640px;}
  }
  @media (min-width:1300px){
    .frame{max-width:720px;}
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:18px 18px 14px;
    background:var(--bg);
    color:var(--on-navy);
    flex-shrink:0;
    position:sticky;top:0;z-index:5;
    border-bottom:1px solid var(--border-soft);
  }
  .crest{
    width:36px;height:36px;border-radius:50%;
    background:linear-gradient(150deg, #e4e8ee 0%, #a8b1bb 45%, #6b7480 100%);
    color:#0d0f12;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);
    font-weight:700;font-size:.74rem;letter-spacing:.01em;
    border:1px solid rgba(255,255,255,.4);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.6), inset 0 -2px 3px rgba(0,0,0,.25);
    flex-shrink:0;
  }
  .brand{display:flex;flex-direction:column;line-height:1.15;flex:1;min-width:0;}
  .brand-name{font-family:var(--font-display);font-weight:700;font-size:1.02rem;letter-spacing:.01em;}
  .brand-sub{font-size:.68rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.09em;}

  /* ---------- View / layout ---------- */
  .view{
    flex:1;
    overflow-y:auto;
    padding:18px 18px calc(28px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:16px;
  }
  .view::-webkit-scrollbar{width:0;}

  .eyebrow{
    font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;
    color:var(--ink-faint);
  }
  h1.page-title{
    font-family:var(--font-display);font-weight:700;font-size:1.7rem;margin:0;
    text-wrap:balance;letter-spacing:-.01em;
  }
  p.lede{color:var(--ink-soft);font-size:.9rem;margin:0;line-height:1.5;}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:18px;
    box-shadow:var(--shadow-card);
  }
  .card-flat{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;}

  .btn{
    font-family:var(--font-body);
    font-weight:700;font-size:.85rem;
    border-radius:999px;
    padding:12px 20px;
    border:1px solid transparent;
    cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    transition:transform .08s ease, opacity .15s ease, background .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px;}
  .btn-primary{background:var(--pill);color:var(--pill-ink);border-color:transparent;}
  .btn-accent{background:linear-gradient(180deg, var(--accent) 0%, #2f66c9 100%);color:#fff;}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--border);}
  .btn-ghost:hover{border-color:var(--ink-faint);}
  .btn-danger-line{background:transparent;color:var(--danger);border-color:var(--danger-soft);}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 14px;font-size:.76rem;border-radius:999px;}
  .btn[disabled]{opacity:.4;cursor:not-allowed;}

  .chip{
    display:inline-flex;align-items:center;gap:5px;
    font-size:.7rem;font-weight:700;letter-spacing:.02em;
    padding:4px 10px;border-radius:999px;white-space:nowrap;
  }
  .chip-success{background:var(--success-soft);color:var(--success);}
  .chip-warning{background:var(--warning-soft);color:var(--warning);}
  .chip-danger{background:var(--danger-soft);color:var(--danger);}
  .chip-neutral{background:var(--surface-3);color:var(--ink-soft);border:1px solid var(--border);}
  .chip-accent{background:var(--accent-soft);color:var(--accent-strong);}

  .row{display:flex;align-items:center;gap:10px;}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .col{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .stack{display:flex;flex-direction:column;gap:10px;}
  .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* next-activity hero: glow de acento sobre fondo oscuro, como una foto desenfocada */
  .hero-activity{
    background:
      radial-gradient(120% 140% at 8% -10%, rgba(76,141,255,.55) 0%, rgba(76,141,255,0) 55%),
      radial-gradient(90% 120% at 100% 0%, rgba(176,156,249,.35) 0%, rgba(176,156,249,0) 55%),
      linear-gradient(165deg, #1c2029 0%, #0c0e12 100%);
    color:var(--on-navy);
    border-radius:var(--radius-lg);
    padding:22px;
    position:relative;
    overflow:hidden;
  }
  .hero-activity::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(125deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,.03) 55%, rgba(255,255,255,0) 100%);
  }
  .hero-date{
    font-family:var(--font-mono);font-size:.72rem;letter-spacing:.06em;
    color:var(--chrome);text-transform:uppercase;font-weight:600;position:relative;
  }
  .hero-title{font-family:var(--font-display);font-size:1.5rem;font-weight:700;margin:6px 0 2px;text-wrap:balance;position:relative;letter-spacing:-.01em;}
  .hero-meta{font-size:.8rem;color:rgba(245,246,248,.65);position:relative;}
  .rsvp-actions{display:flex;gap:8px;margin-top:16px;position:relative;flex-wrap:wrap;}

  .list-item{
    display:flex;align-items:center;gap:12px;
    padding:13px 4px;
    border-bottom:1px solid var(--border-soft);
    cursor:pointer;
  }
  .list-item:last-child{border-bottom:none;}
  .list-item:active{opacity:.65;}
  .list-thumb{
    width:44px;height:44px;border-radius:var(--radius-sm);
    background:var(--surface-3);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-size:.65rem;font-weight:600;color:var(--ink-soft);
    flex-shrink:0;text-align:center;line-height:1.1;overflow:hidden;
  }
  .list-thumb img{width:100%;height:100%;object-fit:cover;}
  .list-title{font-weight:700;font-size:.92rem;}
  .list-sub{font-size:.78rem;color:var(--ink-soft);}
  .chevron{color:var(--ink-faint);flex-shrink:0;}

  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px;}
  .section-head h2{font-family:var(--font-display);font-size:1.05rem;font-weight:700;margin:0;}
  .link-btn{background:none;border:none;color:var(--accent-strong);font-weight:700;font-size:.78rem;cursor:pointer;padding:4px;}

  /* ---------- Tienda: grid de tarjetas con foto ---------- */
  .shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .shop-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    overflow:hidden;cursor:pointer;text-align:left;box-shadow:var(--shadow-card);
    display:flex;flex-direction:column;margin:0;padding:0;
    font:inherit;color:inherit;-webkit-appearance:none;appearance:none;
  }
  .shop-card:active{opacity:.8;}
  .shop-card-img{
    width:100%;aspect-ratio:1.05;background:var(--surface-3);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-family:var(--font-display);font-size:1.6rem;font-weight:700;color:var(--ink-faint);
  }
  .shop-card-img img{width:100%;height:100%;object-fit:cover;}
  .shop-card-body{padding:12px;display:flex;flex-direction:column;gap:4px;}
  .shop-card-name{font-size:.84rem;font-weight:700;line-height:1.25;color:var(--ink);}
  .shop-card-price{font-family:var(--font-mono);font-size:.8rem;color:var(--accent-strong);font-weight:600;}
  .product-hero-img{width:100%;aspect-ratio:1.3;border-radius:var(--radius-lg);background:var(--surface-3);overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:2rem;color:var(--ink-faint);}
  .product-hero-img img{width:100%;height:100%;object-fit:cover;}

  /* ---------- Navegación principal: cápsula pill ---------- */
  .nav-pill{
    display:flex;gap:2px;
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:999px;padding:4px;flex-shrink:0;margin:14px 18px 4px;
    position:sticky;top:73px;z-index:4;
  }
  .nav-pill-btn{
    flex:1;border:none;background:none;cursor:pointer;
    padding:9px 6px;border-radius:999px;
    font-family:var(--font-body);font-size:.78rem;font-weight:700;color:var(--ink-faint);
    transition:background .15s ease, color .15s ease;
  }
  .nav-pill-btn.active{background:var(--pill);color:var(--pill-ink);}

  .segmented{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;}
  .segmented button{
    flex:1;border:none;background:none;padding:9px 6px;border-radius:999px;
    font-weight:700;font-size:.78rem;color:var(--ink-soft);cursor:pointer;font-family:var(--font-body);
  }
  .segmented button.active{background:var(--pill);color:var(--pill-ink);}

  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:.76rem;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .input, select.input{
    font-family:var(--font-body);font-size:.92rem;
    padding:12px 13px;border-radius:var(--radius-sm);
    border:1.5px solid var(--border);background:var(--surface-2);color:var(--ink);
    width:100%;
  }
  .input:focus{outline:none;border-color:var(--accent);}
  .input-pin{font-family:var(--font-mono);letter-spacing:.5em;text-align:center;font-size:1.3rem;font-weight:600;}
  .error-text{color:var(--danger);font-size:.78rem;font-weight:600;}
  .hint-text{color:var(--ink-faint);font-size:.76rem;}
  textarea.input{resize:vertical;min-height:70px;font-family:var(--font-body);}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(3,4,5,.7);backdrop-filter:blur(2px);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
    padding:0;
  }
  @media (min-width:560px){.modal-backdrop{align-items:center;}}
  .modal{
    background:var(--surface);width:100%;max-width:460px;
    border-radius:24px 24px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    box-shadow:var(--shadow-pop);
    max-height:88vh;overflow-y:auto;
    border:1px solid var(--border-soft);border-bottom:none;
  }
  @media (min-width:560px){.modal{border-radius:20px;border-bottom:1px solid var(--border-soft);}}
  @media (min-width:900px){.modal{max-width:520px;}}
  @media (min-width:1300px){.modal{max-width:580px;}}
  .modal-handle{width:38px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 14px;}
  .modal h3{font-family:var(--font-display);font-size:1.15rem;margin:0 0 4px;}

  /* ---------- Admin ---------- */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;}
  .stat-num{font-family:var(--font-mono);font-size:1.4rem;font-weight:600;font-variant-numeric:tabular-nums;}
  .stat-label{font-size:.72rem;color:var(--ink-soft);font-weight:600;}
  .admin-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;mask-image:linear-gradient(to right, black calc(100% - 28px), transparent 100%);-webkit-mask-image:linear-gradient(to right, black calc(100% - 28px), transparent 100%);}
  .admin-tabs::-webkit-scrollbar{display:none;}
  .admin-tab-btn{
    flex-shrink:0;border:1px solid var(--border);background:var(--surface-2);color:var(--ink-soft);
    padding:9px 14px;border-radius:999px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:var(--font-body);
  }
  .admin-tab-btn.active{background:var(--pill);border-color:var(--pill);color:var(--pill-ink);}
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-md);}
  table{width:100%;border-collapse:collapse;font-size:.8rem;min-width:480px;}
  thead th{
    text-align:left;background:var(--surface-2);color:var(--ink-soft);
    font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700;
    padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  tbody td{padding:10px 12px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;}

  .banner{
    display:flex;gap:10px;align-items:flex-start;
    background:var(--accent-soft);border:1px solid rgba(76,141,255,.35);color:var(--accent-strong);
    border-radius:var(--radius-md);padding:12px 13px;font-size:.82rem;line-height:1.4;
  }
  .banner strong{color:inherit;}

  .empty-state{text-align:center;padding:34px 10px;color:var(--ink-faint);}
  .divider{height:1px;background:var(--border-soft);margin:2px 0;}

  /* ---------- Categorías ---------- */
  .cat-dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .cat-chip{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:700;padding:3px 9px 3px 7px;border-radius:999px;white-space:nowrap;}
  .check-row{display:flex;align-items:center;gap:7px;font-size:.82rem;font-weight:600;color:var(--ink);}
  .check-row input{width:16px;height:16px;accent-color:var(--accent);}

  /* ---------- Calendario ---------- */
  .cal-header{display:flex;align-items:center;justify-content:space-between;}
  .cal-month-label{font-family:var(--font-display);font-weight:700;font-size:.98rem;text-transform:capitalize;}
  .cal-nav-btn{
    width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);flex-shrink:0;
  }
  .cal-nav-btn:active{opacity:.7;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-dow{font-size:.6rem;font-weight:700;text-transform:uppercase;color:var(--ink-faint);text-align:center;padding-bottom:3px;}
  .cal-cell{
    aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:.74rem;color:var(--ink);cursor:default;background:var(--surface-2);border:1px solid transparent;
  }
  .cal-cell.other-month{color:var(--ink-faint);opacity:.35;background:transparent;}
  .cal-cell.today{border-color:var(--accent);font-weight:800;color:var(--accent-strong);}
  .cal-cell.has-event{cursor:pointer;}
  .cal-cell.has-event:active{opacity:.6;}
  .cal-dots{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;max-width:20px;}
  .cal-dot-mini{width:5px;height:5px;border-radius:50%;}

  /* ---------- Splash ---------- */
  #splash{
    position:fixed;inset:0;z-index:100;
    background:
      radial-gradient(120% 90% at 15% 0%, rgba(76,141,255,.35) 0%, rgba(76,141,255,0) 55%),
      radial-gradient(100% 80% at 100% 100%, rgba(176,156,249,.25) 0%, rgba(176,156,249,0) 55%),
      var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    opacity:1;transition:opacity .5s ease;cursor:pointer;
  }
  #splash.hide{opacity:0;pointer-events:none;}
  #splash .splash-crest{
    width:64px;height:64px;border-radius:50%;
    background:linear-gradient(150deg, #e4e8ee 0%, #a8b1bb 45%, #6b7480 100%);
    color:#0d0f12;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:1.2rem;
    border:1px solid rgba(255,255,255,.4);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.6), inset 0 -3px 5px rgba(0,0,0,.25);
    animation:splash-pop .6s cubic-bezier(.34,1.56,.64,1) both;
  }
  #splash .splash-text{
    color:var(--on-navy);font-family:var(--font-display);font-weight:700;font-size:1.25rem;
    letter-spacing:-.01em;opacity:0;animation:splash-fade .5s ease .22s forwards;
  }
  #splash .splash-sub{
    color:var(--chrome);font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700;
    opacity:0;animation:splash-fade .5s ease .38s forwards;
  }
  @keyframes splash-pop{0%{transform:scale(.4);opacity:0;}100%{transform:scale(1);opacity:1;}}
  @keyframes splash-fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){
    #splash .splash-crest, #splash .splash-text, #splash .splash-sub{animation:none;opacity:1;transform:none;}
  }
</style>

<div id="splash" onclick="dismissSplash()">
  <div class="splash-crest">ΦΣΑ</div>
  <div class="splash-text">Bienvenido a Zeta Hub</div>
  <div class="splash-sub">Phi Sigma Alpha · Capítulo Zeta</div>
</div>
<div class="frame" id="app"></div>
<div id="modal-root"></div>

<script>
/* ============ Datos de prueba (mock) ============ */
const NOW = new Date();

/* ============ Supabase (backend real) ============ */
const SUPABASE_URL = 'https://jxspulzybmcpkwklrrfs.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Ee1xJc7qOXaTdijNlw6Oxg_za0-J67g';

async function sb(path, opts={}){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
      ...(opts.headers||{}),
    },
  });
  if(!res.ok){
    let errText = res.statusText;
    try{ errText = await res.text(); }catch(e){}
    throw new Error(`Supabase ${res.status}: ${errText}`);
  }
  if(res.status===204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}
function sbRpc(fn, args={}){
  return sb(`rpc/${fn}`, {method:'POST', body: JSON.stringify(args)});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* MEMBERS, ACTIVITIES, SHOP_ITEMS y DOCS arrancan vacíos y se llenan
   con loadFromSupabase() al abrir la app — ver más abajo. */
const MEMBERS = [];

const CATS = {

  capitular: {label:'Reunión Capitular',           color:'--cat-capitular', soft:'--cat-capitular-soft'},

/* Los eventos, la tienda y los documentos viven en Supabase — se cargan
   con loadFromSupabase() al abrir la app. Estos arrays quedan vacíos
   aquí y se llenan por referencia (push), nunca se reasignan, para que
   el resto del código que ya los usa no tenga que cambiar. */
const ACTIVITIES = [];
const SHOP_ITEMS = [];
const DOCS = [];

function pad2(n){ return n<10 ? '0'+n : ''+n; }

/* ---- Mapeo filas de Supabase (snake_case) -> forma que usa la UI ---- */
function mapActivityRow(r){
  return {
    id:r.id, title:r.title, date:r.date, place:r.location||'Por confirmar',
    desc:r.description||'', category:r.category, isPublic:!!r.is_public,
    requiresTicket:!!r.requires_ticket, price:Number(r.price)||0,
    proposed:!!r.proposed, rsvps:{},
  };
}
function applyActivityRow(target, r){
  target.title=r.title; target.date=r.date; target.place=r.location||'Por confirmar';
  target.desc=r.description||''; target.category=r.category; target.isPublic=!!r.is_public;
  target.requiresTicket=!!r.requires_ticket; target.price=Number(r.price)||0; target.proposed=!!r.proposed;
}
function mapShopRow(r){
  return {id:r.id, name:r.name, price:Number(r.price)||0, sizes:null, blurb:r.description||'', imageUrl:r.image_url||''};
}
function mapDocRow(r){
  return {id:r.id, cat:r.category, name:r.title, date:null, restricted:!!r.restricted, url:r.url||''};
}

/* ============ Estado (caché local — la fuente real es Supabase) ============ */
const state = {
  route:'events',
  selectedActivity:null,
  selectedProduct:null,
  currentMemberId:null,
  adminAuthed:false,
  adminPassword:null,
  adminTab:'eventos',
  adminActivity:null,

  calendarMonth:new Date(NOW.getFullYear(), NOW.getMonth(), 1),
  purchases:[],
  tickets:[],
  publicTickets:[],
  fineOverrides:{}, // key `${activityId}:${memberId}` -> 'pagada' | 'exonerada'
  loading:true,
  loadError:null,
};

/* ---- Carga inicial (y recarga) de datos reales desde Supabase ---- */
async function loadFromSupabase(){
  state.loading = true; state.loadError = null; render();
  try{
    const [acts, mems, shop, docs, rsvps, fines, purchases, tickets, publicTickets] = await Promise.all([
      sb('activities?select=*&order=date.asc'),
      sbRpc('list_members'),
      sb('shop_items?select=*'),
      sb('docs?select=*'),
      sb('rsvps?select=*'),
      sb('fines?select=*'),
      sb('purchases?select=*&order=created_at.desc'),
      sb('tickets?select=*&order=created_at.desc'),
      sb('public_tickets?select=*&order=created_at.desc'),
    ]);

    ACTIVITIES.length = 0; (acts||[]).forEach(r=>ACTIVITIES.push(mapActivityRow(r)));
    MEMBERS.length = 0; (mems||[]).forEach(r=>MEMBERS.push(r));
    SHOP_ITEMS.length = 0; (shop||[]).forEach(r=>SHOP_ITEMS.push(mapShopRow(r)));
    DOCS.length = 0; (docs||[]).forEach(r=>DOCS.push(mapDocRow(r)));

    (rsvps||[]).forEach(r=>{
      const a = byId(ACTIVITIES, r.activity_id);
      if(a) a.rsvps[r.member_id] = {status:r.status, excuse:r.excuse||''};
    });
    state.fineOverrides = {};
    (fines||[]).forEach(r=>{ state.fineOverrides[`${r.activity_id}:${r.member_id}`] = r.status; });

    state.purchases.length = 0;
    (purchases||[]).forEach(r=>{
      const item = byId(SHOP_ITEMS, r.item_id);
      state.purchases.push({
        id:r.id, memberId:r.member_id, kind:'tienda', item: item?item.name:'(producto eliminado)',
        detail:'—', qty:r.qty, total:r.qty*(item?item.price:0), method:'—',
        status:r.status, date:(r.created_at||'').slice(0,10),
      });
    });
    state.tickets.length = 0;
    (tickets||[]).forEach(r=>{
      const act = byId(ACTIVITIES, r.activity_id);
      state.tickets.push({
        id:r.id, memberId:r.member_id, activityId:r.activity_id, qty:r.qty,
        total:r.qty*(act?act.price:0), method:'—', status:r.status, date:(r.created_at||'').slice(0,10),
      });
    });
    state.publicTickets.length = 0;
    (publicTickets||[]).forEach(r=>{
      const act = byId(ACTIVITIES, r.activity_id);
      state.publicTickets.push({
        id:r.id, guestName:r.guest_name, guestContact:r.guest_contact, activityId:r.activity_id,
        qty:r.qty, total:r.qty*(act?act.price:0), method:'—', status:r.status, date:(r.created_at||'').slice(0,10),
      });
    });
  }catch(err){
    console.error('Error cargando Zeta Hub desde Supabase:', err);
    state.loadError = err.message || 'No se pudo conectar con el servidor.';
  }
  state.loading = false;
  render();
}

/* ============ Utilidades ============ */
function byId(arr,id){return arr.find(x=>x.id===id);}
function member(id){return MEMBERS.find(m=>m.id===id);}
function firstName(name){return name.split(' ')[0];}
function money(n){return '$' + n.toFixed(2);}
function fmtDateLong(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('es-PR', {weekday:'long', day:'numeric', month:'long'}) + ' · ' +
         d.toLocaleTimeString('es-PR', {hour:'numeric', minute:'2-digit'});
}
function fmtDateShort(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('es-PR', {day:'numeric', month:'short'});
}
function isPast(iso){ return new Date(iso).getTime() < NOW.getTime(); }

/* birthday es un DATE puro ('YYYY-MM-DD'), sin hora. Parsearlo con
   `new Date(iso)` lo interpreta como medianoche UTC y en zonas al oeste
   de UTC (como Puerto Rico) puede mostrar el día anterior — por eso se
   parsea el string directamente en vez de pasar por Date/timezone. */
const MONTH_SHORT_ES = ['ene','feb','mar','abr','may','jun','jul','ago','sept','oct','nov','dic'];
function parseDateParts(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return {y, m, d};
}
function fmtBirthdayShort(iso){
  const {m,d} = parseDateParts(iso);
  return `${d} ${MONTH_SHORT_ES[m-1]}`;
}

/* Reuniones de Directiva y CEN son internas: no aparecen en el calendario ni
   en el historial que ven los fraternos normales, solo en el panel de
   Directiva (que siempre consulta ACTIVITIES directamente, sin filtrar). */
function isHiddenCategory(cat){ return cat==='directiva' || cat==='cen'; }
function memberVisibleActivities(){ return ACTIVITIES.filter(a=>!isHiddenCategory(a.category)); }

function upcomingActivities(list){ list = list || memberVisibleActivities(); return list.filter(a=>!isPast(a.date)).sort((a,b)=> new Date(a.date)-new Date(b.date)); }
function pastActivities(list){ list = list || memberVisibleActivities(); return list.filter(a=>isPast(a.date)).sort((a,b)=> new Date(b.date)-new Date(a.date)); }
function nextActivity(list){ return upcomingActivities(list)[0] || null; }

function catChip(catKey){
  const c = CATS[catKey] || CATS.general;
  return `<span class="cat-chip" style="background:var(${c.soft});color:var(${c.color});"><span class="cat-dot" style="background:var(${c.color});"></span>${c.label}</span>`;
}
function sameDay(d1,d2){ return d1.getFullYear()===d2.getFullYear() && d1.getMonth()===d2.getMonth() && d1.getDate()===d2.getDate(); }
function buildCalendarDays(monthDate){
  const year = monthDate.getFullYear(), month = monthDate.getMonth();
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const cells = [];
  for(let i=startWeekday-1;i>=0;i--){ cells.push({other:true, date:new Date(year, month-1, daysInPrevMonth-i)}); }
  for(let d=1; d<=daysInMonth; d++){ cells.push({other:false, date:new Date(year, month, d)}); }
  let nextDay = 1;
  while(cells.length % 7 !== 0){ cells.push({other:true, date:new Date(year, month+1, nextDay++)}); }
  return cells;
}
function shiftCalendarMonth(delta){
  const d = new Date(state.calendarMonth);
  d.setMonth(d.getMonth()+delta);
  state.calendarMonth = d;
  render();
}

function rsvpStatusFor(activity, memberId){
  const r = activity.rsvps[memberId];
  return r ? r.status : null;
}

/* attendance outcome for a PAST activity+member: 'asistio' | 'excusado' | 'multado' */
function attendanceOutcome(activity, memberId){
  const override = state.fineOverrides[`${activity.id}:${memberId}`];
  const r = activity.rsvps[memberId];
  if(!r || r.status === null) return override==='exonerada' ? 'excusado' : 'multado';
  if(r.status === 'voy') return 'asistio';
  if(r.status === 'no_voy'){
    if(r.excuse && r.excuse.trim().length>0) return 'excusado';
    return override==='exonerada' ? 'excusado' : 'multado';
  }
  return 'multado';
}

function allFines(){
  const out=[];
  pastActivities(ACTIVITIES).forEach(act=>{
    MEMBERS.forEach(m=>{
      const outcome = attendanceOutcome(act, m.id);
      if(outcome==='multado'){
        const key = `${act.id}:${m.id}`;
        out.push({
          activityId:act.id, activityTitle:act.title, memberId:m.id, memberName:m.name,
          reason: act.rsvps[m.id] ? 'No asistió sin excusa aprobada' : 'No respondió / no asistió',
          paid: state.fineOverrides[key]==='pagada',
          key
        });
      }
    });
  });
  return out;
}

/* ============ Acciones ============ */
async function setRsvp(activityId, status, excuse){
  const act = byId(ACTIVITIES, activityId);
  if(!state.currentMemberId) return openIdentifyModal();
  const memberId = state.currentMemberId;
  const prev = act.rsvps[memberId];
  act.rsvps[memberId] = {status, excuse: excuse||''};
  render();
  try{
    await sb('rsvps?on_conflict=activity_id,member_id', {
      method:'POST',
      headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
      body: JSON.stringify({activity_id:activityId, member_id:memberId, status, excuse: excuse||''}),
    });
  }catch(err){
    console.error(err);
    if(prev) act.rsvps[memberId] = prev; else delete act.rsvps[memberId];
    render();
    alert('No se pudo guardar tu respuesta. Revisa tu conexión e intenta de nuevo.');
  }
}
function goRoute(route){ state.route=route; state.selectedActivity=null; state.selectedProduct=null; window.scrollTo(0,0); render(); }
function openActivity(id){ state.selectedActivity=id; state.route='activity'; render(); }
function openProduct(id){ state.selectedProduct=id; state.route='product'; render(); }
function logout(){ state.currentMemberId=null; render(); }
async function setFineOverride(key, value){
  const [activityId, memberId] = key.split(':');
  const prev = state.fineOverrides[key];
  if(value) state.fineOverrides[key] = value; else delete state.fineOverrides[key];
  render();
  try{
    if(value){
      await sb('fines?on_conflict=activity_id,member_id', {
        method:'POST',
        headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
        body: JSON.stringify({activity_id:activityId, member_id:memberId, status:value}),
      });
    } else {
      await sb(`fines?activity_id=eq.${activityId}&member_id=eq.${memberId}`, {method:'DELETE'});
    }
  }catch(err){
    console.error(err);
    if(prev) state.fineOverrides[key] = prev; else delete state.fineOverrides[key];
    render();
    alert('No se pudo actualizar la multa. Intenta de nuevo.');
  }
}
function toggleFineStatus(key){
  setFineOverride(key, state.fineOverrides[key]==='pagada' ? undefined : 'pagada');
}
function exonerateFine(key){
  setFineOverride(key, state.fineOverrides[key]==='exonerada' ? undefined : 'exonerada');
}
async function confirmPurchaseStatus(list, id){
  const o = list.find(x=>x.id===id);
  if(!o) return;
  const prev = o.status;
  o.status = o.status==='Pagado' ? 'Pendiente de confirmar' : 'Pagado';
  render();
  try{
    await sb(`purchases?id=eq.${id}`, {method:'PATCH', headers:{'Prefer':'return=minimal'}, body: JSON.stringify({status:o.status})});
  }catch(err){
    console.error(err);
    o.status = prev; render();
    alert('No se pudo actualizar la compra. Intenta de nuevo.');
  }
}

function viewEvents(){
  const me = state.currentMemberId ? member(state.currentMemberId) : null;
  const next = nextActivity();
  const myStatus = next && me ? rsvpStatusFor(next, me.id) : null;

  const heroRsvp = !next ? '' : `
    <div class="hero-activity">
      <span class="cat-chip" style="background:rgba(238,241,245,.14);color:var(--chrome);margin-bottom:6px;"><span class="cat-dot" style="background:var(--chrome);"></span>${CATS[next.category].label}${next.isPublic?' · Público':''}${next.proposed?' · Propuesta':''}</span>
      <span class="hero-date" style="display:block;">${fmtDateLong(next.date)}</span>
      <div class="hero-title">${next.title}</div>
      <div class="hero-meta">${next.place}</div>
      ${me ? `
        <div class="rsvp-actions">
          <button class="btn ${myStatus==='voy'?'btn-accent':'btn-ghost'} btn-sm" style="${myStatus==='voy'?'':'background:rgba(238,241,245,.12);color:var(--on-navy);border-color:rgba(238,241,245,.3);'}" onclick="setRsvp('${next.id}','voy')">Voy ✓</button>
          <button class="btn btn-ghost btn-sm" style="background:rgba(238,241,245,.12);color:var(--on-navy);border-color:rgba(238,241,245,.3);" onclick="openExcuseModal('${next.id}')">No voy</button>
          <button class="btn btn-ghost btn-sm" style="background:rgba(238,241,245,.12);color:var(--on-navy);border-color:rgba(238,241,245,.3);margin-left:auto;" onclick="openActivity('${next.id}')">Detalles</button>
        </div>
        ${myStatus ? `<div style="margin-top:10px;"><span class="chip ${myStatus==='voy'?'chip-success':'chip-warning'}">${myStatus==='voy'?'Confirmaste que vas':'Avisaste que no vas'}</span></div>` : ''}
      ` : `<div class="rsvp-actions"><button class="btn btn-accent btn-sm" onclick="openActivity('${next.id}')">Ver evento</button></div>`}
    </div>`;

  const toggle = `
    <div class="segmented">
      <button class="${state.eventsView==='lista'?'active':''}" onclick="state.eventsView='lista'; render();">Lista</button>
      <button class="${state.eventsView==='calendario'?'active':''}" onclick="state.eventsView='calendario'; render();">Calendario</button>
    </div>`;

  const listRow = (a, isPastList) => {
    let chip = '';
    if(isPastList && me){
      const outcome = attendanceOutcome(a, me.id);
      chip = outcome==='asistio' ? `<span class="chip chip-success">Asististe</span>`
           : outcome==='excusado' ? `<span class="chip chip-warning">Excusado</span>`
           : `<span class="chip chip-danger">Multado</span>`;
    } else if(!isPastList && me){
      const s = rsvpStatusFor(a, me.id);
      chip = s==='voy' ? `<span class="chip chip-success">Vas</span>`
           : s==='no_voy' ? `<span class="chip chip-warning">No vas</span>`
           : '';
    } else if(a.isPublic){
      chip = `<span class="chip chip-accent">Público</span>`;
    }
    const catColor = `var(${CATS[a.category].color})`, catSoft = `var(${CATS[a.category].soft})`;
    return `
    <div class="list-item" style="border-left:3px solid ${catColor};padding-left:11px;" onclick="openActivity('${a.id}')">
      <div class="list-thumb" style="background:${catSoft};color:${catColor};border-color:transparent;">${fmtDateShort(a.date).toUpperCase()}</div>
      <div class="col" style="flex:1;">
        <span class="list-title">${a.title}</span>
        <span class="list-sub">${CATS[a.category].label} · ${a.place}${a.requiresTicket ? ' · ' + money(a.price) : ''}</span>
        ${a.proposed ? `<span class="chip chip-warning" style="align-self:flex-start;margin-top:3px;">Propuesta</span>` : ''}
      </div>
      ${chip}
    </div>`;
  };

  let body;
  if(state.eventsView==='lista'){
    const up = upcomingActivities(), past = pastActivities();
    const byMonth = {};
    up.forEach(a=>{
      const d = new Date(a.date);
      const key = d.toLocaleDateString('es-PR',{month:'long', year:'numeric'});
      (byMonth[key] = byMonth[key] || []).push(a);
    });
    const upcomingHtml = Object.keys(byMonth).length ? Object.entries(byMonth).map(([month, items])=>`
      <div class="section-head" style="margin-top:10px;"><h2 style="text-transform:capitalize;font-size:.92rem;color:var(--ink-soft);">${month}</h2></div>
      <div class="card">${items.map(a=>listRow(a,false)).join('')}</div>
    `).join('') : `<div class="card"><div class="empty-state">No hay eventos próximos.</div></div>`;
    body = `
      <div class="section-head"><h2>Próximos</h2></div>
      ${upcomingHtml}
      <div class="section-head" style="margin-top:14px;"><h2>Pasados</h2></div>
      <div class="card">${past.map(a=>listRow(a,true)).join('') || `<div class="empty-state">Sin historial todavía.</div>`}</div>
    `;
  } else {
    const cells = buildCalendarDays(state.calendarMonth);
    const dows = ['D','L','M','M','J','V','S'];
    const visible = memberVisibleActivities();
    const calMonth = state.calendarMonth.getMonth()+1;
    const monthEvents = visible.filter(a=>{ const d=new Date(a.date); return d.getFullYear()===state.calendarMonth.getFullYear() && d.getMonth()===state.calendarMonth.getMonth(); })
      .sort((a,b)=> new Date(a.date)-new Date(b.date));
    const monthBirthdays = MEMBERS.filter(m=>m.birthday && parseDateParts(m.birthday).m===calMonth)
      .sort((a,b)=> parseDateParts(a.birthday).d - parseDateParts(b.birthday).d);
    body = `
      <div class="card stack">
        <div class="cal-header">
          <button class="cal-nav-btn" onclick="shiftCalendarMonth(-1)" aria-label="Mes anterior">‹</button>
          <span class="cal-month-label">${state.calendarMonth.toLocaleDateString('es-PR',{month:'long', year:'numeric'})}</span>
          <button class="cal-nav-btn" onclick="shiftCalendarMonth(1)" aria-label="Mes siguiente">›</button>
        </div>
        <div class="cal-grid">
          ${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
          ${cells.map(c=>{
            const dayEvents = visible.filter(a=> sameDay(new Date(a.date), c.date));
            const dayBirthdays = MEMBERS.filter(m=>m.birthday && (()=>{const p=parseDateParts(m.birthday); return p.m===c.date.getMonth()+1 && p.d===c.date.getDate();})());
            const isToday = sameDay(c.date, NOW);
            const cls = ['cal-cell', c.other?'other-month':'', isToday?'today':'', dayEvents.length?'has-event':''].filter(Boolean).join(' ');
            const onclick = dayEvents.length===1 ? `onclick="openActivity('${dayEvents[0].id}')"` : '';
            return `<div class="${cls}" ${onclick}>
              <span>${c.date.getDate()}</span>
              ${dayEvents.length ? `<div class="cal-dots">${dayEvents.slice(0,4).map(a=>`<span class="cal-dot-mini" style="background:var(${CATS[a.category].color});"></span>`).join('')}</div>` : ''}
              ${dayBirthdays.length ? `<span style="font-size:.55rem;line-height:1;">🎂</span>` : ''}
            </div>`;
          }).join('')}
        </div>
      </div>
      ${monthBirthdays.length ? `
      <div class="section-head"><h2>🎂 Cumpleaños este mes</h2></div>
      <div class="card">${monthBirthdays.map(m=>`
        <div class="list-item" style="cursor:default;">
          <div class="list-thumb">${fmtBirthdayShort(m.birthday).toUpperCase()}</div>
          <div class="col" style="flex:1;"><span class="list-title">${m.name}</span></div>
        </div>`).join('')}</div>` : ''}
      <div class="section-head"><h2>Este mes</h2></div>
      <div class="card">${monthEvents.map(a=>listRow(a, isPast(a.date))).join('') || `<div class="empty-state">Sin eventos este mes.</div>`}</div>
    `;
  }

  return `
    <div class="eyebrow">Eventos</div>
    <h1 class="page-title">${me ? `Hola, ${firstName(me.name)}` : 'Eventos del capítulo'}</h1>
    ${heroRsvp}
    ${toggle}
    ${body}
  `;
}

      <div class="field"><label for="ev-place">Lugar</label><input id="ev-place" class="input" value="${editing?editing.place:''}"></div>
      <div class="field"><label for="ev-desc">Descripción</label><textarea id="ev-desc" class="input">${editing?editing.desc:''}</textarea></div>
      <div class="field"><label for="ev-cat">Categoría</label><select id="ev-cat" class="input">${catOptions}</select></div>

        <label class="check-row"><input type="checkbox" id="ev-ticket" ${editing&&editing.requiresTicket?'checked':''}> Requiere taquilla</label>
      </div>
      <div class="field"><label for="ev-price">Precio de taquilla (si aplica)</label><input id="ev-price" type="number" min="0" step="0.01" class="input" value="${editing&&editing.price?editing.price:''}"></div>
      <p id="ev-error" class="error-text" style="display:none;">Completa título, fecha y lugar.</p>
      <button class="btn btn-primary btn-block" onclick="saveEventForm(${editing?`'${editing.id}'`:'null'})">${editing?'Guardar cambios':'Crear evento'}</button>
      ${editing ? `<button class="btn btn-danger-line btn-block" onclick="deleteEventConfirm('${editing.id}')">Eliminar evento</button>` : ''}
      <button class="btn btn-ghost btn-block" onclick="closeModal()">Cancelar</button>
    </div>
  `);

async function saveEventForm(eventId){
  const title = document.getElementById('ev-title').value.trim();
  const dt = document.getElementById('ev-datetime').value;
  const place = document.getElementById('ev-place').value.trim();
  const desc = document.getElementById('ev-desc').value.trim();
  const category = document.getElementById('ev-cat').value;
  const isPublic = document.getElementById('ev-public').checked;
  const requiresTicket = document.getElementById('ev-ticket').checked;
  const price = parseFloat(document.getElementById('ev-price').value) || 0;
  const errEl = document.getElementById('ev-error');
  if(!title || !dt || !place){ errEl.textContent='Completa título, fecha y lugar.'; errEl.style.display='block'; return; }
  const isoDate = dt.length===16 ? dt+':00' : dt;
  const payload = {
    title, date:isoDate, location:place, description:desc, category,
    is_public:isPublic, requires_ticket:requiresTicket, price,
  };
  try{
    if(eventId){
      const rows = await sb(`activities?id=eq.${eventId}`, {method:'PATCH', headers:{'Prefer':'return=representation'}, body: JSON.stringify(payload)});
      applyActivityRow(byId(ACTIVITIES, eventId), rows[0]);
    } else {
      const newId = 'a'+Date.now();
      const rows = await sb('activities', {method:'POST', headers:{'Prefer':'return=representation'}, body: JSON.stringify({...payload, id:newId, proposed:false})});
      ACTIVITIES.push(mapActivityRow(rows[0]));
    }
    closeModal();
    render();
  }catch(err){
    console.error(err);
    errEl.textContent = 'No se pudo guardar en el servidor. Revisa tu conexión e intenta de nuevo.';
    errEl.style.display='block';
  }
}
function deleteEventConfirm(eventId){
  openModal(`
    <h3>¿Eliminar este evento?</h3>
    <p class="lede" style="margin-bottom:14px;">Esta acción no se puede deshacer.</p>
    <div class="stack">
      <button class="btn btn-danger-line btn-block" onclick="deleteEvent('${eventId}')">Sí, eliminar</button>
      <button class="btn btn-ghost btn-block" onclick="closeModal()">Cancelar</button>
    </div>
  `);
}
async function deleteEvent(eventId){
  closeModal();
  try{

/* Bloque de historial (multas, asistencia, compras) reutilizado por el
   perfil del fraterno (pastList filtrado, sin Directiva/CEN) y por el
   drill-down de Directiva en la pestaña Activos (pastList completo). */
function memberHistoryHtml(memberId, pastList){
  const fines = allFines().filter(f=>f.memberId===memberId);
  const purchases = state.purchases.filter(p=>p.memberId===memberId);
  const tickets = state.tickets.filter(t=>t.memberId===memberId);
  const attendanceRows = pastList.map(a=>{
    const outcome = attendanceOutcome(a, memberId);
    return `<div class="list-item">
      <div class="col" style="flex:1;"><span class="list-title">${a.title}</span><span class="list-sub">${fmtDateShort(a.date)}</span></div>
      <span class="chip ${outcome==='asistio'?'chip-success':outcome==='excusado'?'chip-warning':'chip-danger'}">${outcome==='asistio'?'Asistió':outcome==='excusado'?'Excusado':'Multado'}</span>
    </div>`;
  }).join('') || `<div class="empty-state">Sin historial todavía.</div>`;

  const purchaseRows = [
    ...purchases.map(p=>({label:p.item+' '+(p.detail!=='—'?'('+p.detail+')':''), total:p.total, status:p.status})),
    ...tickets.map(t=>({label:'Taquilla — '+byId(ACTIVITIES,t.activityId).title, total:t.total, status:t.status})),
  ].map(x=>`<div class="list-item">
      <div class="col" style="flex:1;"><span class="list-title">${x.label}</span></div>
      <div class="col" style="align-items:flex-end;">
        <strong style="font-family:var(--font-mono);font-size:.85rem;">${money(x.total)}</strong>
        <span class="chip ${x.status==='Pagado'?'chip-success':'chip-warning'}" style="margin-top:2px;">${x.status}</span>
      </div>
    </div>`).join('') || `<div class="empty-state">Sin compras todavía.</div>`;

  return `
    <div class="row" style="gap:10px;">
      <div class="card-flat" style="flex:1;">
        <div class="stat-num" style="font-size:1.1rem;color:${fines.filter(f=>!f.paid).length>0?'var(--danger)':'var(--ink)'};">${fines.filter(f=>!f.paid).length}</div>
        <div class="stat-label">Multas pendientes</div>
      </div>
      <div class="card-flat" style="flex:1;">
        <div class="stat-num" style="font-size:1.1rem;">${purchases.length + tickets.length}</div>
        <div class="stat-label">Compras totales</div>
      </div>
    </div>
    ${fines.length ? `
    <div class="section-head"><h2>Multas</h2></div>
    <div class="card">${fines.map(f=>`
      <div class="list-item">
        <div class="col" style="flex:1;"><span class="list-title">${f.activityTitle}</span><span class="list-sub">${f.reason}</span></div>
        <span class="chip ${f.paid?'chip-success':'chip-danger'}">${f.paid?'Pagada':'Pendiente'}</span>
      </div>`).join('')}</div>` : ''}
    <div class="section-head"><h2>Historial de asistencia</h2></div>
    <div class="card">${attendanceRows}</div>
    <div class="section-head"><h2>Compras</h2></div>
    <div class="card">${purchaseRows}</div>
  `;
}

      <div class="stat-card"><div class="stat-num">${totalActivos}</div><div class="stat-label">Total activos</div></div>
      <div class="stat-card"><div class="stat-num">${confirmedNext}/${totalActivos}</div><div class="stat-label">Confirmados próx. actividad</div></div>
      <div class="stat-card"><div class="stat-num" style="color:${pendingFines>0?'var(--danger)':'var(--ink)'};">${pendingFines}</div><div class="stat-label">Multas pendientes</div></div>
      <div class="stat-card"><div class="stat-num">${money(salesMonth)}</div><div class="stat-label">Ventas registradas</div></div>
    </div>
    <div class="banner">
      <div>ℹ️</div>
      <div>Estos totales son de referencia. El registro oficial del dinero lo mantiene el tesorero en su Excel.</div>
    </div>
    <div class="admin-tabs">
      ${tabs.map(([k,l])=>`<button class="admin-tab-btn ${state.adminTab===k?'active':''}" onclick="state.adminTab='${k}'; render();">${l}</button>`).join('')}
    </div>
    ${adminTabContent()}
  `;
}

function adminTabContent(){
  if(state.adminTab==='eventos'){
    const rows = ACTIVITIES.slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).map(a=>`
      <div class="list-item" style="cursor:default;">
        <span class="cat-dot" style="background:var(${CATS[a.category].color});flex-shrink:0;"></span>
        <div class="col" style="flex:1;">
          <span class="list-title">${a.title}${a.proposed ? ' <span class="chip chip-warning" style="vertical-align:middle;margin-left:4px;">Propuesta</span>' : ''}</span>
          <span class="list-sub">${fmtDateShort(a.date)} · ${CATS[a.category].label}${a.isPublic?' · Público':''}${a.requiresTicket?' · '+money(a.price):''}</span>
        </div>
        <div class="row" style="gap:6px;flex-shrink:0;">
          ${a.proposed ? `<button class="btn btn-ghost btn-sm" onclick="confirmEventProposal('${a.id}')">Confirmar</button>` : ''}
          <button class="btn btn-ghost btn-sm" onclick="openEventFormModal('${a.id}')">Editar</button>
        </div>
      </div>`).join('');
    return `
      <button class="btn btn-primary btn-block" onclick="openEventFormModal(null)">+ Nuevo evento</button>
      <div class="card">${rows || `<div class="empty-state">No hay eventos todavía.</div>`}</div>
      <p class="hint-text">Aquí la directiva crea, edita y elimina eventos: marca si son abiertos al público, si requieren taquilla y su categoría.</p>
    `;
  }

  if(state.adminTab==='asistencia'){
    if(!ACTIVITIES.length) return `<div class="empty-state">No hay eventos todavía.</div>`;
    const opts = ACTIVITIES.slice().sort((a,b)=>new Date(b.date)-new Date(a.date))
      .map(a=>`<option value="${a.id}" ${state.adminActivity===a.id?'selected':''}>${a.title} — ${fmtDateShort(a.date)}</option>`).join('');
    const act = byId(ACTIVITIES, state.adminActivity) || ACTIVITIES[0];
    const past = isPast(act.date);
    const picker = `
      <div class="field"><label for="admin-act-select">Actividad</label>
        <select id="admin-act-select" class="input" onchange="state.adminActivity=this.value; render();">${opts}</select>
      </div>`;
    if(!MEMBERS.length){
      return `${picker}<div class="empty-state">No hay fraternos cargados todavía. Agrégalos en la pestaña "Fraternos".</div>`;
    }

    const memberRow = (m, note, actions) => `
      <div class="list-item" style="cursor:default;">
        <div class="col" style="flex:1;">
          <span class="list-title">${m.name}</span>
          ${note ? `<span class="list-sub">${note}</span>` : ''}
        </div>
        ${actions || ''}
      </div>`;
    const section = (title, items) => items.length ? `
      <div class="section-head"><h2>${title} <span class="hint-text">(${items.length})</span></h2></div>
      <div class="card">${items.join('')}</div>
    ` : '';

    if(past){
      const buckets = {asistio:[], excusado:[], multado:[]};
      MEMBERS.forEach(m=>{
        const outcome = attendanceOutcome(act, m.id);
        const excuse = act.rsvps[m.id] && act.rsvps[m.id].excuse;
        let actions = '';
        if(outcome==='multado'){
          actions = `<button class="btn btn-ghost btn-sm" onclick="exonerateFine('${act.id}:${m.id}')">Exonerar</button>`;
        } else if(outcome==='excusado' && !(excuse && excuse.trim())){
          actions = `<button class="btn btn-ghost btn-sm" onclick="exonerateFine('${act.id}:${m.id}')">Deshacer</button>`;
        }
        buckets[outcome].push(memberRow(m, excuse, actions));
      });
      return `
        ${picker}
        ${section('✅ Asistieron', buckets.asistio)}
        ${section('🟡 Excusados', buckets.excusado)}
        ${section('🔴 A multar — sin excusa', buckets.multado)}
      `;
    } else {
      const buckets = {voy:[], no_voy:[], pendiente:[]};
      MEMBERS.forEach(m=>{
        const s = rsvpStatusFor(act, m.id);
        const excuse = act.rsvps[m.id] && act.rsvps[m.id].excuse;
        const key = s==='voy' ? 'voy' : s==='no_voy' ? 'no_voy' : 'pendiente';
        buckets[key].push(memberRow(m, excuse));
      });
      return `
        ${picker}
        ${section('✅ Van', buckets.voy)}
        ${section('🟡 No van', buckets.no_voy)}
        ${section('⚪️ Sin respuesta', buckets.pendiente)}
      `;
    }
  }

  if(state.adminTab==='multas'){
    const fines = allFines();
    if(!fines.length) return `<div class="empty-state">No hay multas registradas.</div>`;
    return `<div class="table-wrap"><table>
      <thead><tr><th>Activo</th><th>Actividad</th><th>Motivo</th><th>Estatus</th><th></th></tr></thead>
      <tbody>${fines.map(f=>`
        <tr>
          <td>${f.memberName}</td>
          <td>${f.activityTitle}</td>
          <td>${f.reason}</td>
          <td><span class="chip ${f.paid?'chip-success':'chip-danger'}">${f.paid?'Pagada':'Pendiente'}</span></td>
          <td><button class="btn btn-ghost btn-sm" onclick="toggleFineStatus('${f.key}')">${f.paid?'Marcar pendiente':'Marcar pagada'}</button></td>
        </tr>`).join('')}</tbody>
    </table></div>`;
  }

  if(state.adminTab==='tienda'){
    if(!state.purchases.length) return `<div class="empty-state">No hay compras todavía.</div>`;
    return `<div class="table-wrap"><table>
      <thead><tr><th>Activo</th><th>Producto</th><th>Detalle</th><th class="num">Total</th><th>Método</th><th>Estatus</th><th></th></tr></thead>
      <tbody>${state.purchases.map(p=>`
        <tr>
          <td>${member(p.memberId).name}</td>
          <td>${p.item}</td>
          <td>${p.detail} ×${p.qty}</td>
          <td class="num">${money(p.total)}</td>
          <td>${p.method}</td>
          <td><span class="chip ${p.status==='Pagado'?'chip-success':'chip-warning'}">${p.status}</span></td>
          <td>${p.status!=='Pagado'?`<button class="btn btn-ghost btn-sm" onclick="confirmPurchaseStatus(state.purchases,'${p.id}')">Confirmar</button>`:''}</td>
        </tr>`).join('')}</tbody>
    </table></div>`;
  }

  if(state.adminTab==='taquillas'){
    const allTix = [
      ...state.tickets.map(t=>({...t, who:member(t.memberId).name, kind:'Fraterno'})),
      ...state.publicTickets.map(t=>({...t, who:`${t.guestName} (${t.guestContact})`, kind:'Público'})),
    ].sort((a,b)=> new Date(b.date)-new Date(a.date));
    if(!allTix.length) return `<div class="empty-state">No hay taquillas vendidas todavía.</div>`;
    return `<div class="table-wrap"><table>
      <thead><tr><th>Comprador</th><th>Tipo</th><th>Evento</th><th class="num">Cant.</th><th class="num">Total</th><th>Método</th><th>Estatus</th><th></th></tr></thead>
      <tbody>${allTix.map(t=>`
        <tr>
          <td>${t.who}</td>
          <td><span class="chip ${t.kind==='Público'?'chip-accent':'chip-neutral'}">${t.kind}</span></td>
          <td>${byId(ACTIVITIES,t.activityId).title}</td>
          <td class="num">${t.qty}</td>
          <td class="num">${money(t.total)}</td>
          <td>${t.method}</td>
          <td><span class="chip ${t.status==='Pagado'?'chip-success':'chip-warning'}">${t.status}</span></td>
          <td>${t.status!=='Pagado'?`<button class="btn btn-ghost btn-sm" onclick="confirmAnyTicketStatus('${t.id}')">Confirmar</button>`:''}</td>
        </tr>`).join('')}</tbody>
    </table></div>`;
  }

  if(state.adminTab==='activos'){
    const rows = MEMBERS.map(m=>`
      <div class="list-item" style="cursor:default;">
        <div class="col" style="flex:1;cursor:pointer;" onclick="openMemberHistoryModal('${m.id}')">
          <span class="list-title">${m.name}</span>
          <span class="list-sub">${m.role}${m.birthday ? ' · 🎂 ' + fmtBirthdayShort(m.birthday) : ''}</span>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="openMemberFormModal('${m.id}')">Editar</button>
      </div>`).join('');
    return `
      <button class="btn btn-primary btn-block" onclick="openMemberFormModal(null)">+ Nuevo fraterno</button>
      <div class="card">${rows || `<div class="empty-state">No hay fraternos todavía.</div>`}</div>
      <p class="hint-text">Toca el nombre para ver su historial completo de asistencia, multas y compras. "Editar" cambia su info, PIN y cumpleaños.</p>
    `;
  }

  if(state.adminTab==='productos'){
    const rows = SHOP_ITEMS.map(p=>`
      <div class="list-item" style="cursor:default;">
        <div class="list-thumb">${p.name.split(' ').map(w=>w[0]).slice(0,2).join('')}</div>
        <div class="col" style="flex:1;">
          <span class="list-title">${p.name}</span>
          <span class="list-sub">${p.blurb}</span>
        </div>
        <strong style="font-family:var(--font-mono);font-size:.85rem;">${money(p.price)}</strong>
        <div class="row" style="gap:6px;flex-shrink:0;margin-left:8px;">
          <button class="btn btn-ghost btn-sm" onclick="openProductFormModal('${p.id}')">Editar</button>
        </div>
      </div>`).join('');
    return `
      <button class="btn btn-primary btn-block" onclick="openProductFormModal(null)">+ Nuevo producto</button>
      <div class="card">${rows || `<div class="empty-state">No hay productos todavía.</div>`}</div>
    `;
  }

  if(state.adminTab==='documentos'){
    const rows = DOCS.map(d=>`
      <div class="list-item" style="cursor:default;">
        <div class="list-thumb">${icon('doc','width="18" height="18"')}</div>
        <div class="col" style="flex:1;">
          <span class="list-title">${d.name}</span>
          <span class="list-sub">${d.cat}${d.restricted?' · Solo directiva':''}${d.url?'':' · Sin link'}</span>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="openDocFormModal('${d.id}')">Editar</button>
      </div>`).join('');
    return `
      <button class="btn btn-primary btn-block" onclick="openDocFormModal(null)">+ Nuevo documento</button>
      <div class="card">${rows || `<div class="empty-state">No hay documentos todavía.</div>`}</div>
      <p class="hint-text">Los documentos marcados "Solo directiva" quedan ocultos para los fraternos normales.</p>
    `;
  }

  if(state.adminTab==='ajustes'){
    return `
      <div class="card stack">
        <h2 style="font-family:var(--font-display);font-size:1rem;margin:0;">Contraseña de directiva</h2>
        <p class="lede">Esta es la contraseña compartida que usa toda la directiva para entrar a este panel.</p>
        <div class="field"><label for="set-pass-old">Contraseña actual</label><input id="set-pass-old" type="password" class="input"></div>
        <div class="field"><label for="set-pass-new">Contraseña nueva</label><input id="set-pass-new" type="password" class="input"></div>
        <div class="field"><label for="set-pass-new2">Confirmar contraseña nueva</label><input id="set-pass-new2" type="password" class="input"></div>
        <p id="set-pass-msg" style="display:none;"></p>
        <button class="btn btn-primary btn-block" onclick="submitChangeAdminPassword()">Cambiar contraseña</button>
      </div>
    `;
  }
  return '';
}

/* ============ Render principal ============ */
function render(){
  const tabs = [
    ['events','Eventos'],
    ['shop','Tienda'],
    ['docs','Documentos'],
    ['profile','Fraternos'],
  ];
  const activeTabRoute = ['activity'].includes(state.route) ? 'events' : ['product'].includes(state.route) ? 'shop' : state.route==='admin' ? 'profile' : state.route;

  let content;
  if(state.route==='admin' && !state.adminAuthed){ state.route='profile'; }
  if(state.loading){
    content = `
      <div style="text-align:center;padding:70px 20px;">
        <p class="lede">Cargando datos del capítulo…</p>
      </div>`;
  } else if(state.loadError){
    content = `
      <div style="text-align:center;padding:60px 20px;">
        <h1 class="page-title" style="font-size:1.3rem;">No se pudo conectar</h1>
        <p class="lede">${state.loadError}</p>
        <button class="btn btn-primary" style="margin-top:14px;" onclick="loadFromSupabase()">Reintentar</button>
      </div>`;
  } else {
    switch(state.route){
      case 'events': content = viewEvents(); break;
      case 'activity': content = viewActivityDetail(); break;
      case 'shop': content = viewShop(); break;
      case 'product': content = viewProduct(); break;
      case 'docs': content = viewDocs(); break;
      case 'profile': content = viewProfile(); break;
      case 'admin': content = viewAdmin(); break;
      default: content = viewEvents();
    }
  }

  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div class="crest">ΦΣΑ</div>
      <div class="brand">
        <span class="brand-name">Zeta Hub</span>
        <span class="brand-sub">Phi Sigma Alpha · Cap. Zeta</span>
      </div>
    </div>
    <div class="nav-pill">
      ${tabs.map(([r,label])=>`
        <button class="nav-pill-btn ${activeTabRoute===r?'active':''}" onclick="goRoute('${r}')">${label}</button>`).join('')}
    </div>
    <div class="view">${content}</div>
  `;
  renderModal();
}

render();
initSplash();
loadFromSupabase();
</script>
