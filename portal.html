   se entra de lleno a esa área con su propio botón de volver. Solo
   Finanzas agrupa internamente Cuenta/Productos/Ventas/Taquillas
   porque son todas plata — Multas se quedó aparte porque así lo pidió
   el usuario explícitamente. */
const ADMIN_SECTION_LABELS = {
  eventos:'Eventos', asistencia:'Asistencia', cuenta:'Finanzas', productos:'Productos',
  tienda:'Ventas', taquillas:'Taquillas', multas:'Multas', activos:'Fraternos',
  interesados:'Interesados', documentos:'Documentos', ajustes:'Ajustes',
};
const FINANCE_SUBTABS = [['cuenta','Cuenta'],['productos','Productos'],['tienda','Ventas'],['taquillas','Taquillas']];
function goAdminSection(key){ state.adminTab = key; render(); }
function adminNavCardHtml(opts){
  return `
    <div class="card" style="cursor:pointer;" onclick="goAdminSection('${opts.key}')">
      <div class="row-between" style="align-items:center;">
        <div class="row" style="gap:12px;min-width:0;">
          <span style="font-size:1.7rem;flex-shrink:0;">${opts.icon}</span>
          <div class="col" style="min-width:0;">
            <strong style="font-size:1.02rem;">${opts.label}</strong>
            <span class="hint-text truncate">${opts.sub}</span>
          </div>
        </div>
        <div class="row" style="gap:8px;flex-shrink:0;">
          <span class="stat-num" style="font-size:1.25rem;${opts.valueColor?`color:${opts.valueColor};`:''}">${opts.value}</span>
          <span class="chevron">›</span>
        </div>
      </div>
    </div>`;
}
function adminHomeCards(){
  const totalActivos = MEMBERS.length;
  const next = nextActivity(ACTIVITIES);
  const confirmedNext = next ? MEMBERS.filter(m=>rsvpStatusFor(next, m.id)==='voy').length : 0;
  const pendingFines = allFines().filter(f=>!f.paid).length;
  const balance = state.transactions.reduce((s,t)=> s + (t.type==='ingreso'?t.amount:-t.amount), 0);
  const newProspects = state.prospects.filter(p=>p.status!=='contactado').length;
  const upcomingCount = upcomingActivities(ACTIVITIES).length;

  return `
    <div class="row-between">
      <div class="eyebrow">Panel de Directiva</div>
      <button class="link-btn" onclick="adminLogout()">Salir</button>
    </div>
    <h1 class="page-title">Directiva</h1>
    <div class="stack">
      ${adminNavCardHtml({key:'eventos', icon:'📅', label:'Eventos', sub:`${upcomingCount} próximo${upcomingCount===1?'':'s'}`, value:upcomingCount})}
      ${adminNavCardHtml({key:'asistencia', icon:'✅', label:'Asistencia', sub:next?next.title:'Sin próxima actividad', value:`${confirmedNext}/${totalActivos}`})}
      ${adminNavCardHtml({key:'cuenta', icon:'💵', label:'Finanzas', sub:'Balance, productos, ventas y taquillas', value:money(balance), valueColor: balance>=0?'var(--success)':'var(--danger)'})}
      ${adminNavCardHtml({key:'multas', icon:'⚠️', label:'Multas', sub:'Pendientes de pago', value:pendingFines, valueColor: pendingFines>0?'var(--danger)':'var(--ink)'})}
      ${adminNavCardHtml({key:'activos', icon:'👥', label:'Fraternos', sub:'Roster de activos', value:totalActivos})}
      ${adminNavCardHtml({key:'interesados', icon:'🎯', label:'Interesados', sub:'Formulario de la página pública', value:newProspects, valueColor: newProspects>0?'var(--warning)':'var(--ink)'})}
      ${adminNavCardHtml({key:'documentos', icon:'📄', label:'Documentos', sub:'Reglamento, minutas...', value:DOCS.length})}
      ${adminNavCardHtml({key:'ajustes', icon:'⚙️', label:'Ajustes', sub:'Contraseña de directiva', value:''})}
    </div>
  `;
}
function viewAdmin(){
  if(!state.adminTab || state.adminTab==='home') return adminHomeCards();
  const inFinance = FINANCE_SUBTABS.some(([k])=>k===state.adminTab);
  return `
    <button class="btn btn-ghost btn-sm" style="align-self:flex-start;" onclick="goAdminSection('home')">← Panel de Directiva</button>
    <h1 class="page-title">${ADMIN_SECTION_LABELS[state.adminTab]||''}</h1>
    ${inFinance ? `<div class="admin-tabs">${FINANCE_SUBTABS.map(([k,l])=>`<button class="admin-tab-btn ${state.adminTab===k?'active':''}" onclick="goAdminSection('${k}')">${l}</button>`).join('')}</div>` : ''}
    ${adminTabContent()}
  `;
}

function adminTabContent(){
  if(state.adminTab==='cuenta'){
    const balance = state.transactions.reduce((s,t)=> s + (t.type==='ingreso'?t.amount:-t.amount), 0);
    const rows = state.transactions.map(t=>`
      <tr>
        <td>${fmtDateShort(t.date)}</td>
        <td>${t.description}</td>
        <td><span class="chip ${t.type==='ingreso'?'chip-success':'chip-danger'}">${t.type==='ingreso'?'Ingreso':'Gasto'}</span></td>
        <td class="num">${t.type==='ingreso'?'+':'−'}${money(t.amount)}</td>
        <td><button class="btn btn-ghost btn-sm" onclick="deleteTransactionConfirm(${t.id})">Eliminar</button></td>
      </tr>`).join('');
    return `
      <div class="card" style="text-align:center;">
        <div class="stat-label">Balance de la cuenta</div>
        <div class="stat-num" style="font-size:2.1rem;margin-top:6px;color:${balance>=0?'var(--success)':'var(--danger)'};">${money(balance)}</div>
      </div>
      <button class="btn btn-primary btn-block" onclick="openTransactionFormModal()">+ Nuevo registro</button>
      <div class="table-wrap"><table>
        <thead><tr><th>Fecha</th><th>Descripción</th><th>Tipo</th><th class="num">Monto</th><th></th></tr></thead>
        <tbody>${rows || `<tr><td colspan="5" style="text-align:center;color:var(--ink-faint);padding:20px;">Sin registros todavía.</td></tr>`}</tbody>
      </table></div>
    `;
  }

  if(state.adminTab==='eventos'){
    const rows = ACTIVITIES.slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).map(a=>`
      <div class="list-item" style="cursor:default;">
        <span class="cat-dot" style="background:var(${CATS[a.category].color});flex-shrink:0;"></span>
        <div class="col" style="flex:1;">
          <span class="list-title">${a.title}${a.proposed ? ' <span class="chip chip-warning" style="vertical-align:middle;margin-left:4px;">Propuesta</span>' : ''}</span>
          <span class="list-sub">${fmtDateShort(a.date)} · ${CATS[a.category].label}${a.isPublic?' · Público':''}${a.requiresTicket?' · '+money(a.price):''}</span>
        </div>
        <div class="row" style="gap:6px;flex-shrink:0;">
          ${a.proposed ? `<button class="btn btn-ghost btn-sm" onclick="confirmEventProposal('${a.id}')">Confirmar</button>` : ''}
          <button class="btn btn-ghost btn-sm" onclick="openEventFormModal('${a.id}')">Editar</button>
        </div>
      </div>`).join('');
    return `
      <button class="btn btn-primary btn-block" onclick="openEventFormModal(null)">+ Nuevo evento</button>
      <div class="card">${rows || `<div class="empty-state">No hay eventos todavía.</div>`}</div>
      <p class="hint-text">Aquí la directiva crea, edita y elimina eventos: marca si son abiertos al público, si requieren taquilla y su categoría.</p>
    `;
  }

  if(state.adminTab==='asistencia'){
    if(!ACTIVITIES.length) return `<div class="empty-state">No hay eventos todavía.</div>`;
    const mostRecent = ACTIVITIES.slice().sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
    const act = byId(ACTIVITIES, state.adminActivity) || nextActivity(ACTIVITIES) || mostRecent;
    const past = isPast(act.date);
    const picker = `
      <div class="card-flat" style="cursor:pointer;" onclick="openAdminActivityPicker()">
        <div class="row-between">
          <div class="col">
            <span class="hint-text">ACTIVIDAD SELECCIONADA</span>
            <strong style="font-size:.95rem;">${act.title}</strong>
            <span class="list-sub">${CATS[act.category].label} · ${fmtDateShort(act.date)}</span>
          </div>
          <span class="chevron">›</span>
        </div>
      </div>`;
    if(!MEMBERS.length){
      return `${picker}<div class="empty-state">No hay fraternos cargados todavía. Agrégalos en la pestaña "Fraternos".</div>`;
    }

    const memberRow = (m, note, actions) => `
      <div class="list-item" style="cursor:default;">
        <div class="col" style="flex:1;">
          <span class="list-title">${m.name}</span>
          ${note ? `<span class="list-sub">${note}</span>` : ''}
        </div>
        ${actions || ''}
      </div>`;
    const section = (title, items) => items.length ? `
      <div class="section-head"><h2>${title} <span class="hint-text">(${items.length})</span></h2></div>
      <div class="card">${items.join('')}</div>
    ` : '';

    if(past){
      const buckets = {asistio:[], excusado:[], multado:[]};
      MEMBERS.forEach(m=>{
        const outcome = attendanceOutcome(act, m.id);
        const excuse = act.rsvps[m.id] && act.rsvps[m.id].excuse;
        let actions = '';
        if(outcome==='multado'){
          actions = `<button class="btn btn-ghost btn-sm" onclick="exonerateFine('${act.id}:${m.id}')">Exonerar</button>`;
        } else if(outcome==='excusado' && !(excuse && excuse.trim())){
          actions = `<button class="btn btn-ghost btn-sm" onclick="exonerateFine('${act.id}:${m.id}')">Deshacer</button>`;
        }
        buckets[outcome].push(memberRow(m, excuse, actions));
      });
      return `
        ${picker}
        ${section('✅ Asistieron', buckets.asistio)}
        ${section('🟡 Excusados', buckets.excusado)}
        ${section('🔴 A multar — sin excusa', buckets.multado)}
      `;
    } else {
      const buckets = {voy:[], no_voy:[], pendiente:[]};
      MEMBERS.forEach(m=>{
        const s = rsvpStatusFor(act, m.id);
        const excuse = act.rsvps[m.id] && act.rsvps[m.id].excuse;
        const key = s==='voy' ? 'voy' : s==='no_voy' ? 'no_voy' : 'pendiente';
        buckets[key].push(memberRow(m, excuse));
      });
      return `
        ${picker}
        ${section('✅ Van', buckets.voy)}
        ${section('🟡 No van', buckets.no_voy)}
        ${section('⚪️ Sin respuesta', buckets.pendiente)}
      `;
    }
  }

  if(state.adminTab==='multas'){
    const fines = allFines();
    if(!fines.length) return `<div class="empty-state">No hay multas registradas.</div>`;
    return `<div class="table-wrap"><table>
      <thead><tr><th>Activo</th><th>Actividad</th><th>Motivo</th><th>Estatus</th><th></th></tr></thead>
      <tbody>${fines.map(f=>`
        <tr>
          <td>${f.memberName}</td>
          <td>${f.activityTitle}</td>
          <td>${f.reason}</td>
          <td><span class="chip ${f.paid?'chip-success':'chip-danger'}">${f.paid?'Pagada':'Pendiente'}</span></td>
          <td>
            <div class="row" style="gap:6px;flex-wrap:wrap;">
              <button class="btn btn-ghost btn-sm" onclick="toggleFineStatus('${f.key}')">${f.paid?'Marcar pendiente':'Marcar pagada'}</button>
              <button class="btn btn-ghost btn-sm" onclick="exonerateFine('${f.key}')">Exonerar</button>
            </div>
          </td>
        </tr>`).join('')}</tbody>
    </table></div>`;
  }

  if(state.adminTab==='tienda'){
    const allPurchases = [
      ...state.purchases.map(p=>({...p, who:member(p.memberId).name, kind:'Fraterno'})),
      ...state.publicPurchases.map(p=>({...p, who:`${p.guestName} (${p.guestContact})`, kind:'Invitado'})),
    ].sort((a,b)=> new Date(b.date)-new Date(a.date));
    if(!allPurchases.length) return `<div class="empty-state">No hay compras todavía.</div>`;
    return `<div class="table-wrap"><table>
      <thead><tr><th>Comprador</th><th>Tipo</th><th>Producto</th><th>Detalle</th><th class="num">Total</th><th>Método</th><th>Estatus</th><th></th></tr></thead>
      <tbody>${allPurchases.map(p=>`
        <tr>
          <td>${p.who}</td>
          <td><span class="chip ${p.kind==='Invitado'?'chip-accent':'chip-neutral'}">${p.kind}</span></td>
          <td>${p.item}</td>
          <td>${p.detail} ×${p.qty}</td>
          <td class="num">${money(p.total)}</td>
          <td>${p.method}</td>
          <td><span class="chip ${p.status==='Pagado'?'chip-success':'chip-warning'}">${p.status}</span></td>
          <td>${p.status!=='Pagado'?`<button class="btn btn-ghost btn-sm" onclick="confirmAnyPurchaseStatus('${p.id}')">Confirmar</button>`:''}</td>
        </tr>`).join('')}</tbody>
    </table></div>`;
  }

  if(state.adminTab==='taquillas'){
    const allTix = [
      ...state.tickets.map(t=>({...t, who:member(t.memberId)?member(t.memberId).name:'(fraterno eliminado)', kind:'Fraterno'})),
      ...state.publicTickets.map(t=>({...t, who:`${t.guestName} (${t.guestContact})`, kind:'Público'})),
    ].sort((a,b)=> new Date(b.date)-new Date(a.date));
    if(!allTix.length) return `<div class="empty-state">No hay taquillas vendidas todavía.</div>`;
    return `<div class="table-wrap"><table>
      <thead><tr><th>Comprador</th><th>Tipo</th><th>Evento</th><th>Categoría</th><th class="num">Cant.</th><th class="num">Total</th><th>Método</th><th>Comprobante</th><th>Estatus</th><th></th></tr></thead>
      <tbody>${allTix.map(t=>{
        const act = byId(ACTIVITIES,t.activityId);
        return `
        <tr>
          <td>${t.who}</td>
          <td><span class="chip ${t.kind==='Público'?'chip-accent':'chip-neutral'}">${t.kind}</span></td>
          <td>${act?act.title:'(evento eliminado)'}</td>
          <td>${t.tierLabel||'—'}</td>
          <td class="num">${t.qty}</td>
          <td class="num">${money(t.total)}</td>
          <td>${t.method}</td>
          <td>${t.proofUrl?`<a href="${t.proofUrl}" target="_blank" class="link-btn" style="padding:0;">Ver foto</a>`:'—'}</td>
          <td><span class="chip ${t.status==='Pagado'?'chip-success':'chip-warning'}">${t.status}</span></td>
          <td class="row" style="gap:6px;flex-wrap:wrap;">
            ${t.status!=='Pagado'?`<button class="btn btn-ghost btn-sm" onclick="confirmAnyTicketStatus('${t.id}')">Confirmar</button>`:''}
            <button class="btn btn-ghost btn-sm" onclick="openTicketEditModal('${t.id}')">Editar</button>
            <button class="btn btn-danger-line btn-sm" onclick="deleteTicketConfirm('${t.id}')">Eliminar</button>
          </td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`;
  }

  if(state.adminTab==='activos'){
    const rows = MEMBERS.map(m=>`
      <div class="list-item" style="cursor:default;">
        <div class="col" style="flex:1;cursor:pointer;" onclick="openMemberHistoryModal('${m.id}')">
          <span class="list-title">${m.name}</span>
          <span class="list-sub">${m.role}${m.birthday ? ' · 🎂 ' + fmtBirthdayShort(m.birthday) : ''}</span>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="openMemberFormModal('${m.id}')">Editar</button>
      </div>`).join('');
    return `
      <button class="btn btn-primary btn-block" onclick="openMemberFormModal(null)">+ Nuevo fraterno</button>
      <div class="card">${rows || `<div class="empty-state">No hay fraternos todavía.</div>`}</div>
      <p class="hint-text">Toca el nombre para ver su historial completo de asistencia, multas y compras. "Editar" cambia su info, PIN y cumpleaños.</p>
    `;
  }

  if(state.adminTab==='interesados'){
    if(!state.prospects.length) return `<div class="empty-state">No hay interesados todavía. Aparecen aquí cuando alguien llena "Quiero que me inviten" en la página de inicio.</div>`;
    const rows = state.prospects.map(p=>`
      <div class="card-flat">
        <div class="row-between" style="align-items:flex-start;">
          <div class="col">
            <strong style="font-size:.92rem;">${p.name}</strong>
            <span class="hint-text">${p.contact}</span>
          </div>
          <span class="chip ${p.status==='contactado'?'chip-success':'chip-warning'}">${p.status==='contactado'?'Contactado':'Nuevo'}</span>
        </div>
        ${p.message ? `<p class="hint-text" style="margin:8px 0 0;">"${p.message}"</p>` : ''}
        <div class="row" style="gap:6px;margin-top:10px;flex-wrap:wrap;">
          <button class="btn btn-ghost btn-sm" onclick="toggleProspectStatus(${p.id})">${p.status==='contactado'?'Marcar nuevo':'Marcar contactado'}</button>
          <button class="btn btn-danger-line btn-sm" onclick="deleteProspectConfirm(${p.id})">Eliminar</button>
        </div>
      </div>`).join('');
    return `
      <div class="stack">${rows}</div>
      <p class="hint-text">Gente que llenó "Quiero que me inviten" en la página de inicio pública.</p>
    `;
  }

  if(state.adminTab==='productos'){
    const rows = SHOP_ITEMS.map(p=>`
      <div class="list-item" style="cursor:default;">
        <div class="list-thumb">${p.name.split(' ').map(w=>w[0]).slice(0,2).join('')}</div>
        <div class="col" style="flex:1;">
          <span class="list-title">${p.name}</span>
          <span class="list-sub">${p.blurb}</span>
        </div>
        <strong style="font-family:var(--font-mono);font-size:.85rem;">${money(p.price)}</strong>
        <div class="row" style="gap:6px;flex-shrink:0;margin-left:8px;">
          <button class="btn btn-ghost btn-sm" onclick="openProductFormModal('${p.id}')">Editar</button>
        </div>
      </div>`).join('');
    return `
      <button class="btn btn-primary btn-block" onclick="openProductFormModal(null)">+ Nuevo producto</button>
      <div class="card">${rows || `<div class="empty-state">No hay productos todavía.</div>`}</div>
    `;
  }

  if(state.adminTab==='documentos'){
    const rows = DOCS.map(d=>`
      <div class="list-item" style="cursor:default;">
        <div class="list-thumb">${icon('doc','width="18" height="18"')}</div>
        <div class="col" style="flex:1;">
          <span class="list-title">${d.name}</span>
          <span class="list-sub">${d.cat}${d.restricted?' · Solo directiva':''}${d.url?'':' · Sin link'}</span>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="openDocFormModal('${d.id}')">Editar</button>
      </div>`).join('');
    return `
      <button class="btn btn-primary btn-block" onclick="openDocFormModal(null)">+ Nuevo documento</button>
      <div class="card">${rows || `<div class="empty-state">No hay documentos todavía.</div>`}</div>
      <p class="hint-text">Los documentos marcados "Solo directiva" quedan ocultos para los fraternos normales.</p>
    `;
  }

  if(state.adminTab==='ajustes'){
    return `
      <div class="card stack">
        <h2 style="font-family:var(--font-display);font-size:1rem;margin:0;">Contraseña de directiva</h2>
        <p class="lede">Esta es la contraseña compartida que usa toda la directiva para entrar a este panel.</p>
        <div class="field"><label for="set-pass-old">Contraseña actual</label><input id="set-pass-old" type="password" class="input"></div>
        <div class="field"><label for="set-pass-new">Contraseña nueva</label><input id="set-pass-new" type="password" class="input"></div>
        <div class="field"><label for="set-pass-new2">Confirmar contraseña nueva</label><input id="set-pass-new2" type="password" class="input"></div>
        <p id="set-pass-msg" style="display:none;"></p>
        <button class="btn btn-primary btn-block" onclick="submitChangeAdminPassword()">Cambiar contraseña</button>
      </div>
    `;
  }
  return '';
}

/* ============ Render principal ============ */
function render(){
  const tabs = [
    ['events','Eventos'],
    ['shop','Tienda'],
    ['docs','Documentos'],
    ['profile','Fraternos'],
  ];
  const activeTabRoute = ['activity'].includes(state.route) ? 'events' : ['product'].includes(state.route) ? 'shop' : state.route==='admin' ? 'profile' : state.route;

  let content;
  if(state.route==='admin' && !state.adminAuthed){ state.route='profile'; }
  if(state.loading){
    content = `
      <div style="text-align:center;padding:70px 20px;">
        <p class="lede">Cargando datos del capítulo…</p>
      </div>`;
  } else if(state.loadError){
    content = `
      <div style="text-align:center;padding:60px 20px;">
        <h1 class="page-title" style="font-size:1.3rem;">No se pudo conectar</h1>
        <p class="lede">${state.loadError}</p>
        <button class="btn btn-primary" style="margin-top:14px;" onclick="loadFromSupabase()">Reintentar</button>
      </div>`;
  } else {
    switch(state.route){
      case 'events': content = viewEvents(); break;
      case 'activity': content = viewActivityDetail(); break;
      case 'shop': content = viewShop(); break;
      case 'product': content = viewProduct(); break;
      case 'docs': content = viewDocs(); break;
      case 'profile': content = viewProfile(); break;
      case 'admin': content = viewAdmin(); break;
      default: content = viewEvents();
    }
  }

  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <a href="index.html" style="display:contents;"><div class="crest"><img src="images/logo.png" alt="Phi Sigma Alpha, Capítulo Zeta"></div></a>
      <div class="brand">
        <span class="brand-name">Zeta Hub</span>
        <span class="brand-sub">Phi Sigma Alpha · Cap. Zeta</span>
      </div>
    </div>
    <div class="nav-pill">
      ${tabs.map(([r,label])=>`
        <button class="nav-pill-btn ${activeTabRoute===r?'active':''}" onclick="goRoute('${r}')">${label}</button>`).join('')}
    </div>
    <div class="view">${content}</div>
  `;
  renderModal();
}

render();
initSplash();
loadFromSupabase();
</script>
