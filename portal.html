<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zeta Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090b;
    --surface:#131519;
    --surface-2:#1a1d22;
    --surface-3:#22262d;
    --ink:#f5f6f8;
    --ink-soft:#a6acb6;
    --ink-faint:#6c7280;
    --border:#24272e;
    --border-soft:#1a1d22;
    --navy:#1b1f26;
    --navy-strong:#0a0b0d;
    --on-navy:#f5f6f8;
    --chrome:#8ab4ff;
    --accent:#4c8dff;
    --accent-strong:#8ab4ff;
    --accent-soft:rgba(76,141,255,.14);
    --pill:#ffffff;
    --pill-ink:#0b0c0f;
    --success:#3ddc9a;
    --success-soft:rgba(61,220,154,.14);
    --warning:#fbbf24;
    --warning-soft:rgba(251,191,36,.14);
    --danger:#f87171;
    --danger-soft:rgba(248,113,113,.14);
    --cat-general:#5b9bf5; --cat-general-soft:rgba(91,155,245,.16);
    --cat-capitular:#b09cf9; --cat-capitular-soft:rgba(176,156,249,.16);
    --cat-directiva:#9aa1ad; --cat-directiva-soft:rgba(154,161,173,.16);
    --cat-cen:#f472b6; --cat-cen-soft:rgba(244,114,182,.16);
    --cat-social:#fb923c; --cat-social-soft:rgba(251,146,60,.16);
    --cat-civica:#2dd4bf; --cat-civica-soft:rgba(45,212,191,.16);
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:10px;
    --font-display:'Archivo', 'Segoe UI', sans-serif;
    --font-body:'Public Sans', -apple-system, 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, monospace;
    --shadow-card:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -16px rgba(0,0,0,.7);
    --shadow-pop:0 30px 70px -24px rgba(0,0,0,.9);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  .frame{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  @media (min-width:900px){
    .frame{max-width:640px;}
  }
  @media (min-width:1300px){
    .frame{max-width:720px;}
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:18px 18px 14px;
    background:var(--bg);
    color:var(--on-navy);
    flex-shrink:0;
    position:sticky;top:0;z-index:5;
    border-bottom:1px solid var(--border-soft);
  }
  .crest{
    width:36px;height:36px;border-radius:50%;
    background:linear-gradient(150deg, #e4e8ee 0%, #a8b1bb 45%, #6b7480 100%);
    color:#0d0f12;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);
    font-weight:700;font-size:.74rem;letter-spacing:.01em;
    border:1px solid rgba(255,255,255,.4);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.6), inset 0 -2px 3px rgba(0,0,0,.25);
    flex-shrink:0;
    overflow:hidden;
  }
  .crest img{width:100%;height:100%;object-fit:cover;}
  .brand{display:flex;flex-direction:column;line-height:1.15;flex:1;min-width:0;}
  .brand-name{font-family:var(--font-display);font-weight:700;font-size:1.02rem;letter-spacing:.01em;}
  .brand-sub{font-size:.68rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.09em;}

  /* ---------- View / layout ---------- */
  .view{
    flex:1;
    overflow-y:auto;
    padding:18px 18px calc(28px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:16px;
  }
  .view::-webkit-scrollbar{width:0;}

  .eyebrow{
    font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;
    color:var(--ink-faint);
  }
  h1.page-title{
    font-family:var(--font-display);font-weight:700;font-size:1.7rem;margin:0;
    text-wrap:balance;letter-spacing:-.01em;
  }
  p.lede{color:var(--ink-soft);font-size:.9rem;margin:0;line-height:1.5;}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:18px;
    box-shadow:var(--shadow-card);
  }
  .card-flat{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;}

  .btn{
    font-family:var(--font-body);
    font-weight:700;font-size:.85rem;
    border-radius:999px;
    padding:12px 20px;
    border:1px solid transparent;
    cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    transition:transform .08s ease, opacity .15s ease, background .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px;}
  .btn-primary{background:var(--pill);color:var(--pill-ink);border-color:transparent;}
  .btn-accent{background:linear-gradient(180deg, var(--accent) 0%, #2f66c9 100%);color:#fff;}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--border);}
  .btn-ghost:hover{border-color:var(--ink-faint);}
  .btn-danger-line{background:transparent;color:var(--danger);border-color:var(--danger-soft);}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 14px;font-size:.76rem;border-radius:999px;}
  .btn[disabled]{opacity:.4;cursor:not-allowed;}

  .chip{
    display:inline-flex;align-items:center;gap:5px;
    font-size:.7rem;font-weight:700;letter-spacing:.02em;
    padding:4px 10px;border-radius:999px;white-space:nowrap;
  }
  .chip-success{background:var(--success-soft);color:var(--success);}
  .chip-warning{background:var(--warning-soft);color:var(--warning);}
  .chip-danger{background:var(--danger-soft);color:var(--danger);}
  .chip-neutral{background:var(--surface-3);color:var(--ink-soft);border:1px solid var(--border);}
  .chip-accent{background:var(--accent-soft);color:var(--accent-strong);}

  .row{display:flex;align-items:center;gap:10px;}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .col{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .stack{display:flex;flex-direction:column;gap:10px;}
  .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* next-activity hero: glow de acento sobre fondo oscuro, como una foto desenfocada */
  .hero-activity{
    background:
      radial-gradient(120% 140% at 8% -10%, rgba(76,141,255,.55) 0%, rgba(76,141,255,0) 55%),
      radial-gradient(90% 120% at 100% 0%, rgba(176,156,249,.35) 0%, rgba(176,156,249,0) 55%),
      linear-gradient(165deg, #1c2029 0%, #0c0e12 100%);
    color:var(--on-navy);
    border-radius:var(--radius-lg);
    padding:22px;
    position:relative;
    overflow:hidden;
    flex-shrink:0;
  }
  .hero-activity::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(125deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,.03) 55%, rgba(255,255,255,0) 100%);
  }
  .hero-eyebrow{
    font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;
    color:rgba(245,246,248,.55);position:relative;margin-bottom:8px;
  }
  .hero-date{
    font-family:var(--font-mono);font-size:.72rem;letter-spacing:.06em;
    color:var(--chrome);text-transform:uppercase;font-weight:600;position:relative;
  }
  .hero-title{font-family:var(--font-display);font-size:1.5rem;font-weight:700;margin:6px 0 2px;text-wrap:balance;position:relative;letter-spacing:-.01em;}
  .hero-meta{font-size:.8rem;color:rgba(245,246,248,.65);position:relative;}
  .detail-meta-text{font-size:1.05rem;font-weight:600;color:var(--on-navy);position:relative;line-height:1.3;}
  .corner-date-num{font-family:var(--font-display);font-size:2.4rem;font-weight:800;line-height:1;position:relative;color:var(--on-navy);}
  .corner-date-month{font-family:var(--font-mono);font-size:.75rem;font-weight:700;letter-spacing:.1em;color:var(--chrome);position:relative;margin-top:2px;}
  .corner-time{font-family:var(--font-display);font-size:1.7rem;font-weight:800;line-height:1;position:relative;color:var(--on-navy);}
  .purchase-card{border-color:var(--border);}
  .purchase-price{font-family:var(--font-display);font-size:1.4rem;font-weight:800;color:var(--on-navy);flex-shrink:0;}
  .rsvp-actions{display:flex;gap:8px;margin-top:16px;position:relative;flex-wrap:wrap;}

  .list-item{
    display:flex;align-items:center;gap:12px;
    padding:13px 4px;
    border-bottom:1px solid var(--border-soft);
    cursor:pointer;
  }
  .list-item:last-child{border-bottom:none;}
  .list-item:active{opacity:.65;}
  .list-thumb{
    width:44px;height:44px;border-radius:var(--radius-sm);
    background:var(--surface-3);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-size:.65rem;font-weight:600;color:var(--ink-soft);
    flex-shrink:0;text-align:center;line-height:1.1;overflow:hidden;
  }
  .list-thumb img{width:100%;height:100%;object-fit:cover;}
  .list-title{font-weight:700;font-size:.92rem;}
  .list-sub{font-size:.78rem;color:var(--ink-soft);}
  .chevron{color:var(--ink-faint);flex-shrink:0;}

  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px;}
  .section-head h2{font-family:var(--font-display);font-size:1.05rem;font-weight:700;margin:0;}
  .link-btn{background:none;border:none;color:var(--accent-strong);font-weight:700;font-size:.78rem;cursor:pointer;padding:4px;}

  /* ---------- Tienda: grid de tarjetas con foto ---------- */
  .shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .shop-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    overflow:hidden;cursor:pointer;text-align:left;box-shadow:var(--shadow-card);
    display:flex;flex-direction:column;margin:0;padding:0;
    font:inherit;color:inherit;-webkit-appearance:none;appearance:none;
  }
  .shop-card:active{opacity:.8;}
  .shop-card-img{
    width:100%;aspect-ratio:1.05;background:var(--surface-3);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-family:var(--font-display);font-size:1.6rem;font-weight:700;color:var(--ink-faint);
  }
  .shop-card-img img{width:100%;height:100%;object-fit:cover;}
  .shop-card-body{padding:12px;display:flex;flex-direction:column;gap:4px;}
  .shop-card-name{font-size:.84rem;font-weight:700;line-height:1.25;color:var(--ink);}
  .shop-card-price{font-family:var(--font-mono);font-size:.8rem;color:var(--accent-strong);font-weight:600;}
  .product-hero-img{width:100%;aspect-ratio:1.3;border-radius:var(--radius-lg);background:var(--surface-3);overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:2rem;color:var(--ink-faint);flex-shrink:0;}
  .product-hero-img img{width:100%;height:100%;object-fit:cover;}

  /* ---------- Formulario de producto (admin): vista previa + precios en fila ---------- */
  .prod-form-preview{
    width:92px;height:92px;border-radius:var(--radius-lg);
    background:var(--surface-3);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    margin:0 auto 6px;
    font-family:var(--font-display);font-weight:700;font-size:1.4rem;color:var(--ink-faint);
  }
  .prod-form-preview img{width:100%;height:100%;object-fit:cover;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;min-width:0;}

  /* ---------- Navegación principal: cápsula pill ---------- */
  .nav-pill{
    display:flex;gap:2px;
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:999px;padding:4px;flex-shrink:0;margin:14px 18px 4px;
    position:sticky;top:73px;z-index:4;
  }
  .nav-pill-btn{
    flex:1;border:none;background:none;cursor:pointer;
    padding:9px 6px;border-radius:999px;
    font-family:var(--font-body);font-size:.78rem;font-weight:700;color:var(--ink-faint);
    transition:background .15s ease, color .15s ease;
  }
  .nav-pill-btn.active{background:var(--pill);color:var(--pill-ink);}

  .segmented{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;}
  .segmented button{
    flex:1;border:none;background:none;padding:9px 6px;border-radius:999px;
    font-weight:700;font-size:.78rem;color:var(--ink-soft);cursor:pointer;font-family:var(--font-body);
  }
  .segmented button.active{background:var(--pill);color:var(--pill-ink);}

  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:.76rem;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .input, select.input{
    font-family:var(--font-body);font-size:.92rem;
    padding:12px 13px;border-radius:var(--radius-sm);
    border:1.5px solid var(--border);background:var(--surface-2);color:var(--ink);
    width:100%;
  }
  .input:focus{outline:none;border-color:var(--accent);}
  .input-pin{font-family:var(--font-mono);letter-spacing:.5em;text-align:center;font-size:1.3rem;font-weight:600;}
  .error-text{color:var(--danger);font-size:.78rem;font-weight:600;}
  .hint-text{color:var(--ink-faint);font-size:.76rem;}
  textarea.input{resize:vertical;min-height:70px;font-family:var(--font-body);}

  /* ---------- Selector de taquillas (categoría en tarjetas + cantidad con contador) ---------- */
  .tier-cards{display:flex;flex-direction:column;gap:8px;}
  .tier-card{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    width:100%;text-align:left;font-family:var(--font-body);
    padding:13px 15px;border-radius:var(--radius-md);
    border:1.5px solid var(--border);background:var(--surface-2);color:var(--ink);
    cursor:pointer;transition:border-color .15s ease, background .15s ease;
  }
  .tier-card:active{transform:scale(.98);}
  .tier-card.active{border-color:var(--accent);background:var(--accent-soft);}
  .tier-card-label{font-weight:700;font-size:.9rem;}
  .tier-card-price{font-family:var(--font-mono);font-weight:600;color:var(--ink-soft);}
  .tier-card.active .tier-card-price{color:var(--accent-strong);}
  .tier-card-check{
    width:20px;height:20px;border-radius:50%;flex-shrink:0;
    border:1.5px solid var(--border);color:#fff;font-size:.7rem;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .tier-card.active .tier-card-check{border-color:var(--accent);background:var(--accent);}

  .qty-stepper{display:flex;align-items:center;justify-content:center;gap:20px;padding:4px 0;}
  .qty-btn{
    width:44px;height:44px;border-radius:50%;flex-shrink:0;
    border:1.5px solid var(--border);background:var(--surface-2);color:var(--ink);
    font-size:1.3rem;font-weight:700;line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:border-color .15s ease, opacity .15s ease;
  }
  .qty-btn:active{transform:scale(.94);}
  .qty-btn[disabled]{opacity:.35;cursor:not-allowed;}
  .qty-input{
    width:48px;text-align:center;
    font-family:var(--font-mono);font-size:1.4rem;font-weight:700;color:var(--ink);
    background:transparent;border:none;pointer-events:none;
  }
  .ticket-total-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border-radius:var(--radius-md);
    background:var(--surface-2);border:1px solid var(--border);
  }
  .ticket-total-label{font-size:.8rem;color:var(--ink-soft);font-weight:600;}
  .ticket-total-amount{font-family:var(--font-mono);font-size:1.25rem;font-weight:700;color:var(--ink);}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(3,4,5,.7);backdrop-filter:blur(2px);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
    padding:0;
  }
  @media (min-width:560px){.modal-backdrop{align-items:center;}}
  .modal{
    background:var(--surface);width:100%;max-width:460px;
    border-radius:24px 24px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    box-shadow:var(--shadow-pop);
    max-height:88vh;overflow-y:auto;
    border:1px solid var(--border-soft);border-bottom:none;
  }
  @media (min-width:560px){.modal{border-radius:20px;border-bottom:1px solid var(--border-soft);}}
  @media (min-width:900px){.modal{max-width:520px;}}
  @media (min-width:1300px){.modal{max-width:580px;}}
  .modal-handle{width:38px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 14px;}
  .modal h3{font-family:var(--font-display);font-size:1.15rem;margin:0 0 4px;}

  /* ---------- Admin ---------- */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;}
  .stat-num{font-family:var(--font-mono);font-size:1.4rem;font-weight:600;font-variant-numeric:tabular-nums;}
  .stat-label{font-size:.72rem;color:var(--ink-soft);font-weight:600;}
  .admin-tabs{display:flex;flex-wrap:wrap;gap:6px;}
  .admin-tab-btn{
    flex-shrink:0;border:1px solid var(--border);background:var(--surface-2);color:var(--ink-soft);
    padding:9px 14px;border-radius:999px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:var(--font-body);
  }
  .admin-tab-btn.active{background:var(--pill);border-color:var(--pill);color:var(--pill-ink);}
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-md);}
  table{width:100%;border-collapse:collapse;font-size:.8rem;min-width:480px;}
  thead th{
    text-align:left;background:var(--surface-2);color:var(--ink-soft);
    font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700;
    padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  tbody td{padding:10px 12px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;}

  .banner{
    display:flex;gap:10px;align-items:flex-start;
    background:var(--accent-soft);border:1px solid rgba(76,141,255,.35);color:var(--accent-strong);
    border-radius:var(--radius-md);padding:12px 13px;font-size:.82rem;line-height:1.4;
  }
  .banner strong{color:inherit;}

  .empty-state{text-align:center;padding:34px 10px;color:var(--ink-faint);}
  .divider{height:1px;background:var(--border-soft);margin:2px 0;}

  /* ---------- Categorías ---------- */
  .cat-dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .cat-chip{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:700;padding:3px 9px 3px 7px;border-radius:999px;white-space:nowrap;}
  .check-row{display:flex;align-items:center;gap:7px;font-size:.82rem;font-weight:600;color:var(--ink);}
  .check-row input{width:16px;height:16px;accent-color:var(--accent);}

  /* ---------- Calendario ---------- */
  .cal-header{display:flex;align-items:center;justify-content:space-between;}
  .cal-month-label{font-family:var(--font-display);font-weight:700;font-size:.98rem;text-transform:capitalize;}
  .cal-nav-btn{
    width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);flex-shrink:0;
  }
  .cal-nav-btn:active{opacity:.7;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-dow{font-size:.6rem;font-weight:700;text-transform:uppercase;color:var(--ink-faint);text-align:center;padding-bottom:3px;}
  .cal-cell{
    min-height:58px;border-radius:10px;padding:4px 3px;
    display:flex;flex-direction:column;align-items:stretch;gap:2px;
    font-size:.72rem;color:var(--ink);cursor:default;background:var(--surface-2);border:1px solid transparent;
    overflow:hidden;
  }
  .cal-cell.other-month{color:var(--ink-faint);opacity:.35;background:transparent;}
  .cal-cell.today{border-color:var(--accent);}

<script>
/* ============ Datos de prueba (mock) ============ */
const NOW = new Date();

/* ============ Supabase (backend real) ============ */
const SUPABASE_URL = 'https://jxspulzybmcpkwklrrfs.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Ee1xJc7qOXaTdijNlw6Oxg_za0-J67g';

async function sb(path, opts={}){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
      ...(opts.headers||{}),
    },
  });
  if(!res.ok){
    let errText = res.statusText;
    try{ errText = await res.text(); }catch(e){}
    throw new Error(`Supabase ${res.status}: ${errText}`);
  }
  if(res.status===204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}
function sbRpc(fn, args={}){
  return sb(`rpc/${fn}`, {method:'POST', body: JSON.stringify(args)});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* MEMBERS, ACTIVITIES, SHOP_ITEMS y DOCS arrancan vacíos y se llenan
   con loadFromSupabase() al abrir la app — ver más abajo. */
const MEMBERS = [];

const CATS = {
  general:   {label:'Reunión General',            color:'--cat-general',   soft:'--cat-general-soft'},
  capitular: {label:'Reunión Capitular',           color:'--cat-capitular', soft:'--cat-capitular-soft'},
  directiva: {label:'Reunión de Directiva',        color:'--cat-directiva', soft:'--cat-directiva-soft'},
  cen:       {label:'Comité Ejecutivo Central',    color:'--cat-cen',       soft:'--cat-cen-soft'},
  social:    {label:'Social',                      color:'--cat-social',    soft:'--cat-social-soft'},
  civica:    {label:'Servicio Comunitario',         color:'--cat-civica',   soft:'--cat-civica-soft'},
};

/* Los eventos, la tienda y los documentos viven en Supabase — se cargan
   con loadFromSupabase() al abrir la app. Estos arrays quedan vacíos
   aquí y se llenan por referencia (push), nunca se reasignan, para que
   el resto del código que ya los usa no tenga que cambiar. */
const ACTIVITIES = [];
const SHOP_ITEMS = [];
const DOCS = [];

function pad2(n){ return n<10 ? '0'+n : ''+n; }

/* ---- Mapeo filas de Supabase (snake_case) -> forma que usa la UI ---- */
function mapActivityRow(r){
  return {
    id:r.id, title:r.title, date:r.date, place:r.location||'Por confirmar',

  };
}
function applyActivityRow(target, r){
  target.title=r.title; target.date=r.date; target.place=r.location||'Por confirmar';
  target.desc=r.description||''; target.category=r.category; target.isPublic=!!r.is_public;
  target.requiresTicket=!!r.requires_ticket; target.price=Number(r.price)||0; target.proposed=!!r.proposed;
  target.activoPrice = r.activo_price!=null ? Number(r.activo_price) : null;
  target.ticketTiers = Array.isArray(r.ticket_tiers) ? r.ticket_tiers : [];
}
function mapShopRow(r){
  return {id:r.id, name:r.name, price:Number(r.price)||0, activoPrice: r.activo_price!=null ? Number(r.activo_price) : null, sizes:null, blurb:r.description||'', imageUrl:r.image_url||''};
}
function mapDocRow(r){

}

/* ============ Estado (caché local — la fuente real es Supabase) ============ */
const state = {
  route:'events',
  selectedActivity:null,
  selectedProduct:null,
  currentMemberId: localStorage.getItem('zetahub_member_id') || null,
  adminAuthed:false,
  adminPassword:null,
  adminTab:'home',
  adminActivity:null,
  eventsView:'lista',
  calendarMonth:new Date(NOW.getFullYear(), NOW.getMonth(), 1),
  purchases:[],
  publicPurchases:[],
  tickets:[],
  publicTickets:[],
  prospects:[],
  transactions:[],
  fineOverrides:{}, // key `${activityId}:${memberId}` -> 'pagada' | 'exonerada'
  loading:true,
  loadError:null,
};

/* ---- Carga inicial (y recarga) de datos reales desde Supabase ---- */
async function loadFromSupabase(){
  state.loading = true; state.loadError = null; render();
  try{
    const [acts, mems, shop, docs, rsvps, fines, purchases, publicPurchases, tickets, publicTickets] = await Promise.all([
      sb('activities?select=*&order=date.asc'),
      sbRpc('list_members'),
      sb('shop_items?select=*'),
      sb('docs?select=*'),
      sb('rsvps?select=*'),
      sb('fines?select=*'),
      sb('purchases?select=*&order=created_at.desc'),
      sb('public_purchases?select=*&order=created_at.desc'),
      sb('tickets?select=*&order=created_at.desc'),
      sb('public_tickets?select=*&order=created_at.desc'),
    ]);

    ACTIVITIES.length = 0; (acts||[]).forEach(r=>ACTIVITIES.push(mapActivityRow(r)));
    MEMBERS.length = 0; (mems||[]).forEach(r=>MEMBERS.push(mapMemberRow(r)));
    SHOP_ITEMS.length = 0; (shop||[]).forEach(r=>SHOP_ITEMS.push(mapShopRow(r)));
    DOCS.length = 0; (docs||[]).forEach(r=>DOCS.push(mapDocRow(r)));

    /* La identidad persiste en localStorage para no pedir cumpleaños/PIN
       en cada visita — pero si el fraterno guardado ya no existe (lo
       borraron del roster), se limpia para no dejar la sesión en un
       estado inválido. */
    if(state.currentMemberId && !member(state.currentMemberId)){
      state.currentMemberId = null;
      localStorage.removeItem('zetahub_member_id');
    }

    (rsvps||[]).forEach(r=>{
      const a = byId(ACTIVITIES, r.activity_id);
      if(a) a.rsvps[r.member_id] = {status:r.status, excuse:r.excuse||''};
    });
    state.fineOverrides = {};
    (fines||[]).forEach(r=>{ state.fineOverrides[`${r.activity_id}:${r.member_id}`] = r.status; });

    state.purchases.length = 0;
    (purchases||[]).forEach(r=>{
      const item = byId(SHOP_ITEMS, r.item_id);
      state.purchases.push({
        id:r.id, memberId:r.member_id, kind:'tienda', item: item?item.name:'(producto eliminado)',
        detail:'—', qty:r.qty, total:r.qty*(item?item.price:0), method:'—',
        status:r.status, date:(r.created_at||'').slice(0,10),
      });
    });
    state.publicPurchases.length = 0;
    (publicPurchases||[]).forEach(r=>{
      const item = byId(SHOP_ITEMS, r.item_id);
      state.publicPurchases.push({
        id:r.id, guestName:r.guest_name, guestContact:r.guest_contact, item: item?item.name:'(producto eliminado)',
        detail:'—', qty:r.qty, total:r.qty*(item?item.price:0), method:'—',
        status:r.status, date:(r.created_at||'').slice(0,10),
      });
    });
    state.tickets.length = 0;
    (tickets||[]).forEach(r=>{
      const act = byId(ACTIVITIES, r.activity_id);
      const tier = act && r.tier_label ? act.ticketTiers.find(t=>t.label===r.tier_label) : null;
      const unit = tier ? tier.price : (act ? act.price : 0);
      state.tickets.push({
        id:r.id, memberId:r.member_id, activityId:r.activity_id, qty:r.qty,
        total:r.qty*unit, method:'—', status:r.status, tierLabel:r.tier_label, proofUrl:r.payment_proof_url, date:(r.created_at||'').slice(0,10),
      });
    });
    state.publicTickets.length = 0;
    (publicTickets||[]).forEach(r=>{
      const act = byId(ACTIVITIES, r.activity_id);
      const tier = act && r.tier_label ? act.ticketTiers.find(t=>t.label===r.tier_label) : null;
      const unit = tier ? tier.price : (act ? act.price : 0);
      state.publicTickets.push({
        id:r.id, guestName:r.guest_name, guestContact:r.guest_contact, activityId:r.activity_id,
        qty:r.qty, total:r.qty*unit, method:'—', status:r.status, tierLabel:r.tier_label, proofUrl:r.payment_proof_url, date:(r.created_at||'').slice(0,10),
      });
    });
  }catch(err){
    console.error('Error cargando Zeta Hub desde Supabase:', err);
    state.loadError = err.message || 'No se pudo conectar con el servidor.';
  }
  state.loading = false;
  render();
}

/* list_members() (público) solo expone id/name/role/birthday. Con la

}
async function fetchMembers(){

let modalStack = [];

/* ============ Utilidades ============ */
function byId(arr,id){return arr.find(x=>x.id===id);}
function member(id){return MEMBERS.find(m=>m.id===id);}
function firstName(name){return name.split(' ')[0];}
function money(n){return '$' + n.toFixed(2);}
/* Los activos del capítulo pagan 15% menos que el invitado, tanto en
   taquillas como en tienda. El invitado siempre paga precio completo. */
const ACTIVO_DISCOUNT = 0.15;
function activoPrice(price){ return price * (1 - ACTIVO_DISCOUNT); }
/* La directiva puede fijar un precio de activo exacto por producto o
   evento (columna activo_price); si lo deja en blanco (null), se sigue
   calculando automático con el 15% de descuento de siempre. */
function resolveActivoPrice(basePrice, explicitActivoPrice){
  return (explicitActivoPrice!=null) ? explicitActivoPrice : activoPrice(basePrice);
}
/* Todo el capítulo opera en hora de Puerto Rico (UTC-4, sin horario de
   verano). Se fija timeZone explícitamente en vez de confiar en la del
   dispositivo del que mira la app — si no, un fraterno de viaje o un
   teléfono mal configurado vería las horas corridas. */
const PR_TZ = 'America/Puerto_Rico';
function fmtDateLong(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('es-PR', {weekday:'long', day:'numeric', month:'long', timeZone:PR_TZ}) + ' · ' +
         d.toLocaleTimeString('es-PR', {hour:'numeric', minute:'2-digit', timeZone:PR_TZ});
}
function fmtDateShort(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('es-PR', {day:'numeric', month:'short', timeZone:PR_TZ});
}
/* Partes sueltas para el layout de "esquinas" del detalle de evento:
   día/mes grande en una esquina, hora grande en la otra. */
function fmtDateParts(iso){
  const d = new Date(iso);
  const day = d.toLocaleDateString('es-PR', {day:'numeric', timeZone:PR_TZ});
  const month = d.toLocaleDateString('en-US', {month:'short', timeZone:PR_TZ}).toUpperCase().replace('.','');
  const weekday = d.toLocaleDateString('es-PR', {weekday:'long', timeZone:PR_TZ});
  const time = d.toLocaleTimeString('es-PR', {hour:'numeric', minute:'2-digit', timeZone:PR_TZ});
  return {day, month, weekday, time};
}
/* Convierte un instante UTC guardado a la hora de pared en Puerto Rico
   que espera un <input type="datetime-local">, para que al editar un
   evento se vea la misma hora que la directiva escribió originalmente. */
function toDatetimeLocalPR(iso){
  const d = new Date(iso);
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone:PR_TZ, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false,
  }).formatToParts(d).reduce((acc,p)=>{ acc[p.type]=p.value; return acc; }, {});
  return `${parts.year}-${parts.month}-${parts.day}T${parts.hour==='24'?'00':parts.hour}:${parts.minute}`;
}
function isPast(iso){ return new Date(iso).getTime() < NOW.getTime(); }

/* birthday es un DATE puro ('YYYY-MM-DD'), sin hora. Parsearlo con
   `new Date(iso)` lo interpreta como medianoche UTC y en zonas al oeste
   de UTC (como Puerto Rico) puede mostrar el día anterior — por eso se
   parsea el string directamente en vez de pasar por Date/timezone. */
const MONTH_SHORT_ES = ['ene','feb','mar','abr','may','jun','jul','ago','sept','oct','nov','dic'];
function parseDateParts(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return {y, m, d};
}
function fmtBirthdayShort(iso){
  const {m,d} = parseDateParts(iso);
  return `${d} ${MONTH_SHORT_ES[m-1]}`;
}

/* Reuniones de Directiva y CEN son internas: no aparecen en el calendario ni
   en el historial que ven los fraternos normales, solo en el panel de
   Directiva (que siempre consulta ACTIVITIES directamente, sin filtrar). */
function isHiddenCategory(cat){ return cat==='directiva' || cat==='cen'; }
function memberVisibleActivities(){ return ACTIVITIES.filter(a=>!isHiddenCategory(a.category)); }

function upcomingActivities(list){ list = list || memberVisibleActivities(); return list.filter(a=>!isPast(a.date)).sort((a,b)=> new Date(a.date)-new Date(b.date)); }
function pastActivities(list){ list = list || memberVisibleActivities(); return list.filter(a=>isPast(a.date)).sort((a,b)=> new Date(b.date)-new Date(a.date)); }
function nextActivity(list){ return upcomingActivities(list)[0] || null; }

function catChip(catKey){
  const c = CATS[catKey] || CATS.general;
  return `<span class="cat-chip" style="background:var(${c.soft});color:var(${c.color});"><span class="cat-dot" style="background:var(${c.color});"></span>${c.label}</span>`;
}
function sameDay(d1,d2){ return d1.getFullYear()===d2.getFullYear() && d1.getMonth()===d2.getMonth() && d1.getDate()===d2.getDate(); }
function buildCalendarDays(monthDate){
  const year = monthDate.getFullYear(), month = monthDate.getMonth();
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const cells = [];
  for(let i=startWeekday-1;i>=0;i--){ cells.push({other:true, date:new Date(year, month-1, daysInPrevMonth-i)}); }
  for(let d=1; d<=daysInMonth; d++){ cells.push({other:false, date:new Date(year, month, d)}); }
  let nextDay = 1;
  while(cells.length % 7 !== 0){ cells.push({other:true, date:new Date(year, month+1, nextDay++)}); }
  return cells;
}
function shiftCalendarMonth(delta){
  const d = new Date(state.calendarMonth);
  d.setMonth(d.getMonth()+delta);
  state.calendarMonth = d;
  render();
}

function rsvpStatusFor(activity, memberId){
  const r = activity.rsvps[memberId];
  return r ? r.status : null;
}

/* attendance outcome for a PAST activity+member: 'asistio' | 'excusado' | 'multado' */
function attendanceOutcome(activity, memberId){
  const override = state.fineOverrides[`${activity.id}:${memberId}`];
  const r = activity.rsvps[memberId];
  if(!r || r.status === null) return override==='exonerada' ? 'excusado' : 'multado';
  if(r.status === 'voy') return 'asistio';
  if(r.status === 'no_voy'){
    if(r.excuse && r.excuse.trim().length>0) return 'excusado';
    return override==='exonerada' ? 'excusado' : 'multado';
  }
  return 'multado';
}

function allFines(){
  const out=[];
  pastActivities(ACTIVITIES).forEach(act=>{
    MEMBERS.forEach(m=>{
      const outcome = attendanceOutcome(act, m.id);
      if(outcome==='multado'){
        const key = `${act.id}:${m.id}`;
        out.push({
          activityId:act.id, activityTitle:act.title, memberId:m.id, memberName:m.name,
          reason: act.rsvps[m.id] ? 'No asistió sin excusa aprobada' : 'No respondió / no asistió',
          paid: state.fineOverrides[key]==='pagada',
          key
        });
      }
    });
  });
  return out;
}

/* ============ Modales ============ */
function openModal(html){
  modalStack.push(html);
  renderModal();
}
function closeModal(){
  modalStack.pop();
  renderModal();
}
function renderModal(){
  const root = document.getElementById('modal-root');
  if(modalStack.length===0){ root.innerHTML=''; return; }
  root.innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <div class="modal-handle"></div>
      ${modalStack[modalStack.length-1]}
    </div>
  </div>`;
}

function iconClose(){
  return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
}

/* ---- Splash de bienvenida ---- */
let splashTimer = null;
function dismissSplash(){
  const el = document.getElementById('splash');
  if(!el || el.classList.contains('hide')) return;
  el.classList.add('hide');
  clearTimeout(splashTimer);

/* El primer fraterno que selecciona su nombre todavía no tiene PIN
   (hasPin===false) — ahí se le pide crear su PIN y decir su cumpleaños
   en vez de pedirle un PIN que nunca configuró. */
/* Muestra si el fraterno ya contestó a la próxima actividad, para que
   al identificarse quede claro que puede entrar y cambiar su respuesta
   en vez de sentir que tiene que "empezar de cero". */
function identifyRsvpHint(m){
  const next = nextActivity(ACTIVITIES);
  if(!next) return '';
  const status = rsvpStatusFor(next, m.id);
  if(!status) return '';
  const label = status==='voy' ? 'Vas ✓' : 'No vas';
  return `<p class="hint-text">Ya respondiste a "${next.title}" (${fmtDateShort(next.date)}): <strong>${label}</strong>. Entra para cambiarlo si quieres.</p>`;
}
function renderIdentifyFields(){
  const nameEl = document.getElementById('idf-name');
  const container = document.getElementById('idf-fields');
  if(!nameEl || !container) return;
  const m = member(nameEl.value);
  if(!m) { container.innerHTML=''; return; }
  container.innerHTML = m.hasPin ? `
    ${identifyRsvpHint(m)}
    <div class="field">
      <label for="idf-pin">PIN</label>
      <input id="idf-pin" class="input input-pin" type="tel" inputmode="numeric" maxlength="4" placeholder="••••">
    </div>` : `
    ${identifyRsvpHint(m)}
    <p class="hint-text">Primera vez que entras: crea tu PIN de 4 dígitos y dinos tu cumpleaños (sale en el calendario del capítulo).</p>
    <div class="field">
      <label for="idf-new-pin">Crea tu PIN (4 dígitos)</label>
      <input id="idf-new-pin" class="input input-pin" type="tel" inputmode="numeric" maxlength="4" placeholder="••••">
    </div>
    <div class="field">
      <label for="idf-birthday">Tu cumpleaños</label>
      <input id="idf-birthday" type="date" class="input">
    </div>`;
}
/* Si "Voy"/"No voy", "Comprar como activo", etc. abrieron este modal a
   mitad de camino (sin estar identificado todavía), retoma esa acción
   justo después de identificarse en vez de dejarla perdida — así el
   fraterno no tiene que repetir el click una vez identificado. */
async function finishIdentify(id){
  state.currentMemberId = id;
  localStorage.setItem('zetahub_member_id', id);
  closeModal();
  await fetchMembers();
  const action = window.__pendingAction;
  window.__pendingAction = null;
  if(action) action();
}
async function submitIdentify(){
  const id = document.getElementById('idf-name').value;
  const m = member(id);
  const errEl = document.getElementById('idf-error');
  errEl.style.display='none';
  if(m && m.hasPin){
    const pin = document.getElementById('idf-pin').value.trim();
    try{
      const ok = await sbRpc('check_pin', {p_member_id:id, p_pin:pin});
      if(ok===true){
        await finishIdentify(id);
      } else {
        errEl.textContent = 'PIN incorrecto. Intenta de nuevo.';
        errEl.style.display='block';
      }
    }catch(err){
      console.error(err);
      errEl.textContent = 'No se pudo verificar el PIN. Revisa tu conexión e intenta de nuevo.';
      errEl.style.display='block';
    }
  } else {
    const pin = document.getElementById('idf-new-pin').value.trim();
    const birthday = document.getElementById('idf-birthday').value || null;
    if(!/^\d{4}$/.test(pin)){ errEl.textContent='El PIN debe ser de 4 dígitos.'; errEl.style.display='block'; return; }
    if(!birthday){ errEl.textContent='Escribe tu cumpleaños.'; errEl.style.display='block'; return; }
    try{
      const ok = await sbRpc('set_member_pin_and_birthday', {p_member_id:id, p_pin:pin, p_birthday:birthday});
      if(ok===true){
        await finishIdentify(id);
      } else {
        /* El servidor rechaza esto solo cuando el PIN ya existe (no es
           realmente la "primera vez"). En vez de dejar al fraterno
           atascado, se cambia el formulario al campo de PIN para que
           pueda entrar con el que ya configuró. */
        m.hasPin = true;
        renderIdentifyFields();
        errEl.textContent = 'Ya habías configurado tu PIN antes — escríbelo arriba para entrar. Si no lo recuerdas, pide a la directiva que lo reinicie.';
        errEl.style.display='block';
      }
    }catch(err){
      console.error(err);
      errEl.textContent = 'No se pudo guardar. Revisa tu conexión e intenta de nuevo.';
      errEl.style.display='block';
    }
  }
}

/* Sube la captura de ATH Móvil a Supabase Storage (bucket público
   payment-proofs) apenas se elige el archivo, y solo habilita el botón
   de confirmar una vez que la subida termina. */
async function handleProofFileChange(){
  const fileInput = document.getElementById('proof-file');
  const statusEl = document.getElementById('proof-status');
  const btn = document.getElementById('proof-confirm-btn');
  const file = fileInput.files[0];
  if(!file) return;
  btn.disabled = true;
  statusEl.textContent = 'Subiendo...';
  try{
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
    const path = `proofs/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/payment-proofs/${path}`, {
      method:'POST',
      headers:{ apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': file.type||'image/jpeg' },
      body: file,
    });
    if(!res.ok) throw new Error(await res.text());
    window.__proofUrl = `${SUPABASE_URL}/storage/v1/object/public/payment-proofs/${path}`;
    statusEl.textContent = '✓ Comprobante subido';
    btn.disabled = false;
  }catch(err){
    console.error(err);
    statusEl.textContent = 'No se pudo subir la imagen. Intenta de nuevo.';
    btn.disabled = true;
  }
}
function confirmPayment(method){
  const opts = window.__pendingPayment;
  const status = method==='ATH Móvil' ? 'Pendiente de confirmar' : 'Pagado';
  opts.onConfirm(method, status, window.__proofUrl);
  closeModal();
  openModal(`

    </div>
  `);
  render();
}

/* ============ Acciones ============ */
async function setRsvp(activityId, status, excuse){
  const act = byId(ACTIVITIES, activityId);
  if(!state.currentMemberId){
    /* Guarda el intento para completarlo automáticamente en cuanto el
       fraterno termine de identificarse — así "Voy"/"No voy" no se
       pierde silenciosamente detrás del modal de identificación. */
    window.__pendingAction = () => setRsvp(activityId, status, excuse);
    return openIdentifyModal();
  }
  const memberId = state.currentMemberId;
  const prev = act.rsvps[memberId];
  act.rsvps[memberId] = {status, excuse: excuse||''};
  render();
  try{
    await sb('rsvps?on_conflict=activity_id,member_id', {
      method:'POST',
      headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
      body: JSON.stringify({activity_id:activityId, member_id:memberId, status, excuse: excuse||''}),
    });
  }catch(err){
    console.error(err);
    if(prev) act.rsvps[memberId] = prev; else delete act.rsvps[memberId];
    render();
    alert('No se pudo guardar tu respuesta. Revisa tu conexión e intenta de nuevo.');
  }
}

/* Exporta un evento como .ics para que el fraterno lo guarde en su
   calendario (Apple Calendar, Google Calendar, Outlook...). Se navega
   directo al blob (sin atributo download) porque así iOS/Safari
   reconoce el mime text/calendar y ofrece "Agregar a Calendario" en
   vez de solo descargar el archivo. */
function icsEscapeText(s){
  return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
}
function toICSDateUTC(date){
  return date.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
}
function downloadICS(activityId){
  const a = byId(ACTIVITIES, activityId);
  if(!a) return;
  const start = new Date(a.date);
  const end = new Date(start.getTime() + 60*60*1000);
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Zeta Hub//ES','CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${a.id}@zetahub.app`,
    `DTSTAMP:${toICSDateUTC(new Date())}`,
    `DTSTART:${toICSDateUTC(start)}`,
    `DTEND:${toICSDateUTC(end)}`,
    `SUMMARY:${icsEscapeText(a.title)}`,
    `LOCATION:${icsEscapeText(a.place)}`,
    `DESCRIPTION:${icsEscapeText(a.desc)}`,
    'END:VEVENT','END:VCALENDAR',
  ].join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  window.location.href = url;
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

        method:'POST',
        headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
        body: JSON.stringify({activity_id:activityId, member_id:memberId, status:value}),
      });
    } else {
      await sb(`fines?activity_id=eq.${activityId}&member_id=eq.${memberId}`, {method:'DELETE'});
    }
  }catch(err){
    console.error(err);
    if(prev) state.fineOverrides[key] = prev; else delete state.fineOverrides[key];
    render();
    alert('No se pudo actualizar la multa. Intenta de nuevo.');
  }
}
function toggleFineStatus(key){
  setFineOverride(key, state.fineOverrides[key]==='pagada' ? undefined : 'pagada');
}
function exonerateFine(key){
  setFineOverride(key, state.fineOverrides[key]==='exonerada' ? undefined : 'exonerada');
}
async function confirmAnyPurchaseStatus(id){
  let o = state.purchases.find(x=>x.id===id);
  let table = 'purchases';
  if(!o){ o = state.publicPurchases.find(x=>x.id===id); table = 'public_purchases'; }
  if(!o) return;
  const prev = o.status;
  o.status = o.status==='Pagado' ? 'Pendiente de confirmar' : 'Pagado';
  render();
  try{
    await sb(`${table}?id=eq.${id}`, {method:'PATCH', headers:{'Prefer':'return=minimal'}, body: JSON.stringify({status:o.status})});
  }catch(err){
    console.error(err);
    o.status = prev; render();
    alert('No se pudo actualizar la compra. Intenta de nuevo.');
  }
}

function viewEvents(){

      <div class="hero-eyebrow">Próximo evento</div>
      <span class="hero-date" style="display:block;">${fmtDateLong(next.date)}</span>
      <div class="hero-title">${next.title}</div>
      <div class="hero-meta">📍 ${next.place}</div>

        <span class="cat-chip" style="background:rgba(238,241,245,.14);color:var(--chrome);"><span class="cat-dot" style="background:var(--chrome);"></span>${CATS[next.category].label}</span>
        ${next.isPublic ? `<span class="chip" style="background:rgba(238,241,245,.14);color:var(--chrome);">Público</span>` : ''}
        ${next.proposed ? `<span class="chip" style="background:rgba(251,191,36,.18);color:#ffd479;">Propuesta</span>` : ''}
      </div>
      ${me ? `
        <div class="rsvp-actions">
          <button class="btn ${myStatus==='voy'?'btn-accent':'btn-ghost'} btn-sm" style="${myStatus==='voy'?'':'background:rgba(238,241,245,.12);color:var(--on-navy);border-color:rgba(238,241,245,.3);'}" onclick="setRsvp('${next.id}','voy')">Voy ✓</button>
          <button class="btn btn-ghost btn-sm" style="background:rgba(238,241,245,.12);color:var(--on-navy);border-color:rgba(238,241,245,.3);" onclick="openExcuseModal('${next.id}')">No voy</button>
          <button class="btn btn-ghost btn-sm" style="background:rgba(238,241,245,.12);color:var(--on-navy);border-color:rgba(238,241,245,.3);margin-left:auto;" onclick="openActivity('${next.id}')">Detalles</button>

    <div class="segmented">
      <button class="${state.eventsView==='lista'?'active':''}" onclick="state.eventsView='lista'; render();">Lista</button>
      <button class="${state.eventsView==='calendario'?'active':''}" onclick="state.eventsView='calendario'; render();">Calendario</button>
    </div>`;

  const listRow = (a, isPastList) => {
    let chip = '';
    if(isPastList && me){
      const outcome = attendanceOutcome(a, me.id);

           : outcome==='excusado' ? `<span class="chip chip-warning">Excusado</span>`
           : `<span class="chip chip-danger">Multado</span>`;
    } else if(!isPastList && me){
      const s = rsvpStatusFor(a, me.id);
      chip = s==='voy' ? `<span class="chip chip-success">Vas</span>`
           : s==='no_voy' ? `<span class="chip chip-warning">No vas</span>`
           : '';

    return `
    <div class="list-item" style="border-left:3px solid ${catColor};padding-left:11px;" onclick="openActivity('${a.id}')">
      <div class="list-thumb" style="background:${catSoft};color:${catColor};border-color:transparent;">${fmtDateShort(a.date).toUpperCase()}</div>
      <div class="col" style="flex:1;">

        <span class="list-sub">${CATS[a.category].label} · ${a.place}${a.requiresTicket ? ' · ' + money(a.price) : ''}</span>

      (byMonth[key] = byMonth[key] || []).push(a);

      <div class="section-head" style="margin-top:10px;"><h2 style="text-transform:capitalize;font-size:.92rem;color:var(--ink-soft);">${month}</h2></div>
      <div class="card">${items.map(a=>listRow(a,false)).join('')}</div>
    `).join('') : `<div class="card"><div class="empty-state">No hay eventos próximos.</div></div>`;
    body = `
      <div class="section-head"><h2>Próximos</h2></div>
      ${upcomingHtml}
      <div class="section-head" style="margin-top:14px;"><h2>Pasados</h2></div>
      <div class="card">${past.map(a=>listRow(a,true)).join('') || `<div class="empty-state">Sin historial todavía.</div>`}</div>
    `;
  } else {
    const cells = buildCalendarDays(state.calendarMonth);
    const dows = ['D','L','M','M','J','V','S'];
    const visible = memberVisibleActivities();
    const calMonth = state.calendarMonth.getMonth()+1;
    const monthEvents = visible.filter(a=>{ const d=new Date(a.date); return d.getFullYear()===state.calendarMonth.getFullYear() && d.getMonth()===state.calendarMonth.getMonth(); })
      .sort((a,b)=> new Date(a.date)-new Date(b.date));
    const monthBirthdays = MEMBERS.filter(m=>m.birthday && parseDateParts(m.birthday).m===calMonth)
      .sort((a,b)=> parseDateParts(a.birthday).d - parseDateParts(b.birthday).d);
    body = `
      <div class="card stack">
        <div class="cal-header">
          <button class="cal-nav-btn" onclick="shiftCalendarMonth(-1)" aria-label="Mes anterior">‹</button>
          <span class="cal-month-label">${state.calendarMonth.toLocaleDateString('es-PR',{month:'long', year:'numeric'})}</span>
          <button class="cal-nav-btn" onclick="shiftCalendarMonth(1)" aria-label="Mes siguiente">›</button>
        </div>
        <div class="cal-grid">
          ${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
          ${cells.map(c=>{
            const dayEvents = visible.filter(a=> sameDay(new Date(a.date), c.date));
            const dayBirthdays = MEMBERS.filter(m=>m.birthday && (()=>{const p=parseDateParts(m.birthday); return p.m===c.date.getMonth()+1 && p.d===c.date.getDate();})());
            const isToday = sameDay(c.date, NOW);
            const cls = ['cal-cell', c.other?'other-month':'', isToday?'today':'', dayEvents.length?'has-event':''].filter(Boolean).join(' ');
            const onclick = dayEvents.length ? `onclick='openDayEvents(${JSON.stringify(dayEvents.map(a=>a.id))})'` : '';
            const shownEvents = dayEvents.slice(0,2);
            const extraCount = dayEvents.length - shownEvents.length;
            return `<div class="${cls}" ${onclick}>
              <span class="cal-daynum">${c.date.getDate()}</span>
              ${shownEvents.map(a=>`<span class="cal-event-chip" style="background:var(${CATS[a.category].color});">${a.title}</span>`).join('')}
              ${extraCount>0 ? `<span class="cal-event-more">+${extraCount} más</span>` : ''}
              ${dayBirthdays.length ? `<span style="font-size:.6rem;line-height:1;text-align:center;">🎂</span>` : ''}
            </div>`;
          }).join('')}
        </div>
      </div>
      ${monthBirthdays.length ? `
      <div class="section-head"><h2>🎂 Cumpleaños este mes</h2></div>
      <div class="card">${monthBirthdays.map(m=>`
        <div class="list-item" style="cursor:default;">
          <div class="list-thumb">${fmtBirthdayShort(m.birthday).toUpperCase()}</div>
          <div class="col" style="flex:1;"><span class="list-title">${m.name}</span></div>
        </div>`).join('')}</div>` : ''}
      <div class="section-head"><h2>Este mes</h2></div>
      <div class="card">${monthEvents.map(a=>listRow(a, isPast(a.date))).join('') || `<div class="empty-state">Sin eventos este mes.</div>`}</div>
    `;
  }

  return `
    <div class="eyebrow">Eventos</div>
    <h1 class="page-title">${me ? `Hola, ${firstName(me.name)}` : 'Eventos del capítulo'}</h1>
    ${heroRsvp}
    ${toggle}
    ${body}
  `;
}

const TICKET_QTY_MIN = 1, TICKET_QTY_MAX = 4;
/* Selector de taquillas como página de compra: categorías en tarjetas
   grandes (no <select>) + contador de cantidad + total siempre visible,
   en vez de dos listas desplegables. Se reusa en la compra de activo
   ('tk') y de invitado ('gt'). */
function ticketSelectorHtml(a, idPrefix){
  const hasTiers = a.ticketTiers && a.ticketTiers.length>0;
  const tierCards = hasTiers ? `
    <div class="field">
      <label>Categoría</label>
      <input type="hidden" id="${idPrefix}-tier" value="0">
      <div class="tier-cards" id="${idPrefix}-tier-cards">
        ${a.ticketTiers.map((t,i)=>`
          <button type="button" class="tier-card ${i===0?'active':''}" onclick="selectTicketTier('${idPrefix}', ${i})">
            <span class="row" style="gap:10px;">
              <span class="tier-card-check">${i===0?'✓':''}</span>
              <span class="tier-card-label">${t.label}</span>
            </span>
            <span class="tier-card-price">${money(t.price)}</span>
          </button>`).join('')}
      </div>
    </div>` : '';
  return `
    ${tierCards}
    <div class="field">
      <label>Cantidad</label>
      <div class="qty-stepper" id="${idPrefix}-qty-stepper">
        <button type="button" class="qty-btn minus" disabled onclick="stepTicketQty('${idPrefix}', -1)">−</button>
        <input id="${idPrefix}-qty" class="qty-input" type="text" inputmode="numeric" value="1" readonly>
        <button type="button" class="qty-btn plus" onclick="stepTicketQty('${idPrefix}', 1)">+</button>
      </div>
    </div>
    <div class="ticket-total-row">
      <span class="ticket-total-label">Total</span>
      <strong class="ticket-total-amount" id="${idPrefix}-total-amount"></strong>
    </div>
  `;
}
function selectTicketTier(idPrefix, idx){
  const hidden = document.getElementById(`${idPrefix}-tier`);
  if(hidden) hidden.value = idx;
  document.querySelectorAll(`#${idPrefix}-tier-cards .tier-card`).forEach((el,i)=>{
    el.classList.toggle('active', i===idx);
    const check = el.querySelector('.tier-card-check');
    if(check) check.textContent = i===idx ? '✓' : '';
  });
  updateTicketTotal(idPrefix);
}
function stepTicketQty(idPrefix, delta){
  const input = document.getElementById(`${idPrefix}-qty`);
  if(!input) return;
  const val = Math.min(TICKET_QTY_MAX, Math.max(TICKET_QTY_MIN, (parseInt(input.value,10)||1)+delta));
  input.value = val;
  updateTicketTotal(idPrefix);
}
function ticketUnitPrice(a, idPrefix){
  if(a.ticketTiers && a.ticketTiers.length){
    const hidden = document.getElementById(`${idPrefix}-tier`);
    const idx = hidden ? parseInt(hidden.value,10) : 0;
    return a.ticketTiers[idx].price;
  }
  return idPrefix==='tk' ? resolveActivoPrice(a.price, a.activoPrice) : a.price;
}
function ticketTierLabel(a, idPrefix){
  if(!a.ticketTiers || !a.ticketTiers.length) return null;
  const hidden = document.getElementById(`${idPrefix}-tier`);
  const idx = hidden ? parseInt(hidden.value,10) : 0;
  return a.ticketTiers[idx].label;
}
function updateTicketTotal(idPrefix){
  const activityId = window.__ticketFormActivity;
  const a = byId(ACTIVITIES, activityId);
  if(!a) return;
  const unit = ticketUnitPrice(a, idPrefix);
  const qtyInput = document.getElementById(`${idPrefix}-qty`);
  const qty = qtyInput ? (parseInt(qtyInput.value,10)||1) : 1;
  const totalEl = document.getElementById(`${idPrefix}-total-amount`);
  if(totalEl) totalEl.textContent = money(unit*qty);
  const minusBtn = document.querySelector(`#${idPrefix}-qty-stepper .minus`);
  const plusBtn = document.querySelector(`#${idPrefix}-qty-stepper .plus`);
  if(minusBtn) minusBtn.disabled = qty<=TICKET_QTY_MIN;
  if(plusBtn) plusBtn.disabled = qty>=TICKET_QTY_MAX;
}
function startTicketPurchase(activityId){
  if(!state.currentMemberId){
    window.__pendingAction = () => startTicketPurchase(activityId);
    return openIdentifyModal();
  }
  const a = byId(ACTIVITIES, activityId);
  window.__ticketFormActivity = activityId;
  openModal(`
    <h3>Comprar taquilla — Activo del Zeta</h3>
    <p class="lede" style="margin-bottom:14px;">${a.title} — ${fmtDateShort(a.date)}. ${a.ticketTiers&&a.ticketTiers.length?'Elige tu categoría.':'Precio con 15% de descuento de activo.'}</p>
    <div class="stack">
      ${ticketSelectorHtml(a,'tk')}
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="confirmTicketQty('${activityId}')">Continuar al pago</button>
    <button class="btn btn-ghost btn-block" onclick="closeModal()">Cancelar</button>
  `);
  updateTicketTotal('tk');
}
function confirmTicketQty(activityId){
  const a = byId(ACTIVITIES, activityId);
  const qty = parseInt(document.getElementById('tk-qty').value, 10);
  const unit = ticketUnitPrice(a, 'tk');
  const tierLabel = ticketTierLabel(a, 'tk');
  const memberId = state.currentMemberId;
  closeModal();
  openPaymentModal('taquilla', {
    label:`${qty} taquilla(s) — ${a.title}${tierLabel?' ('+tierLabel+')':''}`,
    amount: qty*unit,
    onConfirm: async (method, status, proofUrl)=>{
      try{
        const rows = await sb('tickets', {method:'POST', headers:{'Prefer':'return=representation'}, body: JSON.stringify({
          activity_id: activityId, member_id: memberId, qty, status, tier_label: tierLabel, payment_proof_url: proofUrl||null,
        })});
        const r = rows[0];
        state.tickets.push({id:r.id, memberId:r.member_id, activityId:r.activity_id, qty:r.qty, total:qty*unit, method, status:r.status, tierLabel:r.tier_label, proofUrl:r.payment_proof_url, date:(r.created_at||todayISO()).slice(0,10)});
      }catch(err){
        console.error(err);
        alert('No se pudo guardar la compra de taquilla en el servidor. Intenta de nuevo.');
      }
      render();
    }
  });
}

/* ---- Taquilla pública (invitados, sin PIN) ---- */

      <div class="field"><label for="gt-name">Nombre completo</label><input id="gt-name" class="input" placeholder="Nombre y apellido"></div>

      ${ticketSelectorHtml(a,'gt')}

      <button class="btn btn-ghost btn-block" onclick="closeModal()">Cancelar</button>
    </div>
  `);
  updateTicketTotal('gt');
}
function confirmGuestTicketQty(activityId){
  const name = document.getElementById('gt-name').value.trim();
  const contact = document.getElementById('gt-contact').value.trim();
  if(!name || !contact){ document.getElementById('gt-error').style.display='block'; return; }
  const qty = parseInt(document.getElementById('gt-qty').value, 10);
  const a = byId(ACTIVITIES, activityId);
  const unit = ticketUnitPrice(a, 'gt');
  const tierLabel = ticketTierLabel(a, 'gt');
  closeModal();
  openPaymentModal('taquilla-publico', {
    label:`${qty} taquilla(s) — ${a.title}${tierLabel?' ('+tierLabel+')':''}`,
    amount: qty*unit,
    onConfirm: async (method, status, proofUrl)=>{
      try{
        const rows = await sb('public_tickets', {method:'POST', headers:{'Prefer':'return=representation'}, body: JSON.stringify({
          activity_id: activityId, guest_name:name, guest_contact:contact, qty, status, tier_label: tierLabel, payment_proof_url: proofUrl||null,
        })});
        const r = rows[0];

async function saveTicketEdit(id, isGuest){

    await sb(`${table}?id=eq.${id}`, {method:'PATCH', headers:{'Prefer':'return=minimal'}, body: JSON.stringify(payload)});

  }catch(err){

let eventFormTiers = [];
function renderTierRows(){

async function saveEventForm(eventId){
  const title = document.getElementById('ev-title').value.trim();
  const dt = document.getElementById('ev-datetime').value;
  const place = document.getElementById('ev-place').value.trim();
  const desc = document.getElementById('ev-desc').value.trim();
  const category = document.getElementById('ev-cat').value;
  const isPublic = document.getElementById('ev-public').checked;
  const requiresTicket = document.getElementById('ev-ticket').checked;
  const price = parseFloat(document.getElementById('ev-price').value) || 0;
  const activoPriceRaw = document.getElementById('ev-activo-price').value.trim();
  const errEl = document.getElementById('ev-error');
  if(!title || !dt || !place){ errEl.textContent='Completa título, fecha y lugar.'; errEl.style.display='block'; return; }
  if(activoPriceRaw && (isNaN(parseFloat(activoPriceRaw)) || parseFloat(activoPriceRaw)<0)){ errEl.textContent='El precio de activo no es válido.'; errEl.style.display='block'; return; }
  /* El input datetime-local no lleva zona horaria — la directiva siempre
     escribe en hora de Puerto Rico (UTC-4, sin horario de verano), así
     que se fija ese offset explícito al construir el instante UTC real. */
  const isoDate = dt.length===16 ? dt+':00-04:00' : dt;
  const ticketTiers = eventFormTiers.filter(t=>t.label && t.label.trim());
  const payload = {
    title, date:isoDate, location:place, description:desc, category,
    is_public:isPublic, requires_ticket:requiresTicket, price,
    activo_price: activoPriceRaw ? parseFloat(activoPriceRaw) : null,
    ticket_tiers: ticketTiers,
  };
  try{
    if(eventId){
      const rows = await sb(`activities?id=eq.${eventId}`, {method:'PATCH', headers:{'Prefer':'return=representation'}, body: JSON.stringify(payload)});
      applyActivityRow(byId(ACTIVITIES, eventId), rows[0]);
    } else {
      const newId = 'a'+Date.now();
      const rows = await sb('activities', {method:'POST', headers:{'Prefer':'return=representation'}, body: JSON.stringify({...payload, id:newId, proposed:false})});
      ACTIVITIES.push(mapActivityRow(rows[0]));
    }
    closeModal();
    render();
  }catch(err){
    console.error(err);
    errEl.textContent = 'No se pudo guardar en el servidor. Revisa tu conexión e intenta de nuevo.';
    errEl.style.display='block';
  }
}

    <p class="lede" style="margin-bottom:14px;">Esta acción no se puede deshacer.</p>
    <div class="stack">
      <button class="btn btn-danger-line btn-block" onclick="deleteEvent('${eventId}')">Sí, eliminar</button>

/* Sube la foto al mismo bucket público de Supabase Storage que ya se
   usa para comprobantes de pago (payment-proofs), bajo su propia
   carpeta products/ — no hay bucket dedicado para fotos de productos
   todavía, pero este ya está público y acepta imágenes. */
async function handleProductImageUpload(){
  const fileInput = document.getElementById('prod-img-file');
  const statusEl = document.getElementById('prod-img-status');
  const file = fileInput.files[0];
  if(!file) return;
  statusEl.textContent = 'Subiendo...';
  try{
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
    const path = `products/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/payment-proofs/${path}`, {
      method:'POST',
      headers:{ apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': file.type||'image/jpeg' },
      body: file,
    });
    if(!res.ok) throw new Error(await res.text());
    const url = `${SUPABASE_URL}/storage/v1/object/public/payment-proofs/${path}`;
    document.getElementById('prod-img').value = url;
    updateProductPreview();
    statusEl.textContent = '✓ Foto subida';
  }catch(err){
    console.error(err);
    statusEl.textContent = 'No se pudo subir la foto. Intenta de nuevo.';
  }
}
async function saveProductForm(productId){
  const name = document.getElementById('prod-name').value.trim();
  const price = parseFloat(document.getElementById('prod-price').value);
  const activoPriceRaw = document.getElementById('prod-activo-price').value.trim();
  const description = document.getElementById('prod-desc').value.trim();
  const image_url = document.getElementById('prod-img').value.trim();
  const errEl = document.getElementById('prod-error');
  if(!name || isNaN(price) || price<0){ errEl.textContent='Completa nombre y precio.'; errEl.style.display='block'; return; }
  if(activoPriceRaw && (isNaN(parseFloat(activoPriceRaw)) || parseFloat(activoPriceRaw)<0)){ errEl.textContent='El precio de activo no es válido.'; errEl.style.display='block'; return; }
  const payload = { name, price, activo_price: activoPriceRaw ? parseFloat(activoPriceRaw) : null, description, image_url };
  try{
    if(productId){
      const rows = await sb(`shop_items?id=eq.${productId}`, {method:'PATCH', headers:{'Prefer':'return=representation'}, body: JSON.stringify(payload)});
      applyShopRow(byId(SHOP_ITEMS, productId), rows[0]);
    } else {
      const newId = 'p'+Date.now();
      const rows = await sb('shop_items', {method:'POST', headers:{'Prefer':'return=representation'}, body: JSON.stringify({...payload, id:newId})});
      SHOP_ITEMS.push(mapShopRow(rows[0]));
    }
    closeModal();
    render();
  }catch(err){
    console.error(err);
    errEl.textContent = 'No se pudo guardar en el servidor. Revisa tu conexión e intenta de nuevo.';
    errEl.style.display='block';
  }
}

/* Bloque de historial (multas, asistencia, compras) reutilizado por el
   perfil del fraterno (pastList filtrado, sin Directiva/CEN) y por el
   drill-down de Directiva en la pestaña Activos (pastList completo). */
function memberHistoryHtml(memberId, pastList){
  const fines = allFines().filter(f=>f.memberId===memberId);
  const purchases = state.purchases.filter(p=>p.memberId===memberId);
  const tickets = state.tickets.filter(t=>t.memberId===memberId);
  const attendanceRows = pastList.map(a=>{
    const outcome = attendanceOutcome(a, memberId);
    return `<div class="list-item">
      <div class="col" style="flex:1;"><span class="list-title">${a.title}</span><span class="list-sub">${fmtDateShort(a.date)}</span></div>
      <span class="chip ${outcome==='asistio'?'chip-success':outcome==='excusado'?'chip-warning':'chip-danger'}">${outcome==='asistio'?'Asistió':outcome==='excusado'?'Excusado':'Multado'}</span>
    </div>`;
  }).join('') || `<div class="empty-state">Sin historial todavía.</div>`;

  const purchaseRows = [
    ...purchases.map(p=>({label:p.item+' '+(p.detail!=='—'?'('+p.detail+')':''), total:p.total, status:p.status})),
    ...tickets.map(t=>({label:'Taquilla — '+byId(ACTIVITIES,t.activityId).title, total:t.total, status:t.status})),
  ].map(x=>`<div class="list-item">
      <div class="col" style="flex:1;"><span class="list-title">${x.label}</span></div>
      <div class="col" style="align-items:flex-end;">
        <strong style="font-family:var(--font-mono);font-size:.85rem;">${money(x.total)}</strong>
        <span class="chip ${x.status==='Pagado'?'chip-success':'chip-warning'}" style="margin-top:2px;">${x.status}</span>
      </div>
    </div>`).join('') || `<div class="empty-state">Sin compras todavía.</div>`;

  return `
    <div class="row" style="gap:10px;">
      <div class="card-flat" style="flex:1;">
        <div class="stat-num" style="font-size:1.1rem;color:${fines.filter(f=>!f.paid).length>0?'var(--danger)':'var(--ink)'};">${fines.filter(f=>!f.paid).length}</div>
        <div class="stat-label">Multas pendientes</div>
      </div>
      <div class="card-flat" style="flex:1;">
        <div class="stat-num" style="font-size:1.1rem;">${purchases.length + tickets.length}</div>
        <div class="stat-label">Compras totales</div>
      </div>
    </div>
    ${fines.length ? `
    <div class="section-head"><h2>Multas</h2></div>
    <div class="card">${fines.map(f=>`
      <div class="list-item">
        <div class="col" style="flex:1;"><span class="list-title">${f.activityTitle}</span><span class="list-sub">${f.reason}</span></div>
        <span class="chip ${f.paid?'chip-success':'chip-danger'}">${f.paid?'Pagada':'Pendiente'}</span>
      </div>`).join('')}</div>` : ''}
    <div class="section-head"><h2>Historial de asistencia</h2></div>
    <div class="card">${attendanceRows}</div>
    <div class="section-head"><h2>Compras</h2></div>
    <div class="card">${purchaseRows}</div>
  `;
}
